<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Vereinsfarben: weiss, schwarz, ein bisschen Grün (das Türkis aus dem Logo). */
    --bg:#f3f4f3; --panel:#ffffff; --panel2:#f6f7f6; --line:#e1e4e2;
    --text:#111111; --muted:#6b716e; --accent:#1fa88c; --accentT:#0f7a65;
    --head:#111111; --good:#1fa88c; --bad:#d9485a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;border-bottom:3px solid var(--accent)}
  .wrap{max-width:720px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px}
  .top img{width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
  h1{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;margin:0;font-size:28px;color:#fff;line-height:1.05}
  .sub{color:#b9bfbc;font-size:12.5px;margin-top:1px}
  /* Reiter im Raster: acht passen in zwei Reihen à vier, auch auf dem kleinen iPhone. */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#333;border:1px solid #333;border-radius:10px;overflow:hidden;margin-top:9px}
  .seg button{background:#222;white-space:nowrap;color:#b9bfbc;border:0;padding:9px 10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px}
  .seg button img{height:28px;display:block;margin:-6px auto}
  .seg button.on{background:#fff;color:#111}
  @media (min-width:600px){.seg{grid-template-columns:repeat(6,1fr)}}
  .seg button.woche{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase;letter-spacing:.6px}
  .seg button.woche img{height:22px;margin:-4px 0;display:inline-block}
  .wzus{font-size:15px;font-weight:600;text-align:center}
  .wzeile{cursor:pointer}
  .pill.wteam{margin-left:0;background:var(--accentT);font-size:14px;padding:3px 10px;vertical-align:1px}
  .wzugleich{color:#b45309;font-weight:600}
  .wlive .sc{background:#d4001a !important;color:#fff !important}
  .wlivetxt{color:#d4001a;font-weight:700}
  main{max-width:720px;margin:0 auto;padding:4px 12px 60px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .chead,details.card>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
  details.card>summary{cursor:pointer;list-style:none}
  details.card>summary::-webkit-details-marker{display:none}
  /* Aufklappbare Karten (Alle Spiele der Klasse, Früher): deutlich als Knopf (vom Nutzer, 20.10.2026). */
  details.card>summary::after{content:"Anzeigen ▾";flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--accentT);padding:5px 11px;border-radius:20px}
  details.card[open]>summary::after{content:"Zuklappen ▴";background:#fff;color:var(--accentT);box-shadow:inset 0 0 0 1.5px var(--accentT)}
  details.card:not([open])>summary{border-bottom:0}
  h2{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;margin:0;flex:1}
  .hint{font-size:12px;color:var(--muted);text-align:right}
  .hint.tagdatum{font-size:15px;font-weight:600;color:var(--text)}
  .cbody{padding:10px 12px}

<body>
<header><div class="wrap">
  <div class="top">
    <img alt="" id="logo">
    <div style="flex:1"><h1>FC Koeppchen</h1><div class="sub" id="sub">U13 Minimes</div></div>
    <button id="zahnrad" class="zahnrad" hidden aria-label="Mitteilungen">⚙️</button>
  </div>
  <div class="seg" id="seg"></div>
</div></header>
<main id="main"><div class="note">Lade …</div></main>

<script>
// ==== Logik (ohne DOM, wird von test/fussball.mjs ausgeschnitten) ====

// Auf- und Abstieg nach Phase 1 2026-2027, Rundschreiben der FLF (vom Nutzer als Bild):
// Klasse I: 5./6. runter. II und III: 1. hoch, 5./6. runter. IV: 1./2. hoch, 5./6. runter.
// V: 1. jeder Serie und der beste 2. hoch. Die letzte Klasse (bei U13 Klasse VI) hängt von
// den Anmeldungen ab — dort wird nichts markiert, statt etwas zu behaupten.
// Für Phase 2 gibt es noch keine Regeln: neue Phase → neue Zeilen hier.
// Gilt für U13 und U15 (U15: derselbe Wortlaut, vom Nutzer als Text nachgereicht). Für die
// anderen Altersklassen liegt kein Rundschreiben vor, dort wird nichts markiert.
// Schlüssel: Saison, Altersklasse, Phase.
const PHASE1_2026 = {
  1: { auf: [], ab: [5, 6] },
  2: { auf: [1], ab: [5, 6] },
  3: { auf: [1], ab: [5, 6] },
  4: { auf: [1, 2], ab: [5, 6] },
  5: { auf: [1], ab: [], extra: "dazu der beste Zweite aller Serien" },
};
const REGELN = {
  "20262027 U13 Phase 1": PHASE1_2026,
  "20262027 U15 Phase 1": PHASE1_2026,
};

function klasseVon(name) {
  const k = /\bCl\s*(\d+)/i.exec(name), p = /Phase\s*(\d+)/i.exec(name), a = /^(W?U\d+)\b/.exec(name);
  return { nr: k ? +k[1] : null, phase: p ? +p[1] : null, kat: a ? a[1] : null };
}

// Regeln der ganzen Phase (alle Klassen) oder null.
function regelnVon(saisonId, name) {
  const { kat, phase } = klasseVon(name);
  return REGELN[`${saisonId} ${kat} Phase ${phase}`] || null;
}

// → {auf, ab, extra} oder null, wenn für diese Klasse keine Regel bekannt ist.
function zonen(saisonId, name) {
  const r = regelnVon(saisonId, name), { nr } = klasseVon(name);
  return (r && nr && r[nr]) || null;
}

// Sicht einer Mannschaft auf ein Spiel: s/u/n oder null, solange kein Ergebnis da ist.
function ausgang(sp, tid) {
  if (!sp.gespielt || sp.hs == null || sp.as == null) return null;
  const wir = sp.h.id === tid ? sp.hs : sp.as, die = sp.h.id === tid ? sp.as : sp.hs;
  return wir > die ? "s" : wir < die ? "n" : "u";
}

const istLiga = k => k.typ === "CC";
const ROEM = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
const roem = n => ROEM[n] || String(n);

// Mannschaften mit Ligaspielen bekommen einen Reiter. Welche Pokalmannschaften (ohne Liga)
// zu welchem Reiter gehören, legt der Abruf fest (`mit`, tools/fussball.mjs) — dieselbe
// Regel gilt dort für den Kalender.
function aufteilen(D) {
  const tabs = D.teams.filter(t => t.klassen.some(id => istLiga(D.klassen[id])));
  const verein = D.teams.filter(t => !tabs.includes(t));
  return { tabs, verein };
}

// In Zeilen und Tabelle: „FC Koeppchen Wormeldange I“ → „Koeppchen I“, sonst bricht
// das Ergebnis auf dem iPhone um. Gegner bleiben, wie die FLF sie schreibt.
const anzeige = n => n.replace(/^FC Koeppchen Wormeldange\b/, "Koeppchen");
// Umbruch nach „/“ statt mitten im Wort (ENT Mensdorf/Canach/Munsbach I).
const umbruch = s => esc(s).replace(/\//g, "/<wbr>");

// Alles, was ein Reiter zeigt — reine Daten, gerendert wird unten.
function sicht(D, tid, now) {
  const team = D.teams.find(t => t.id === tid);
  const verein = D.teams.filter(t => (team.mit || []).includes(t.id));
  // Alle FLF-Nummern: die Mannschaft kann je Phase eine andere haben (tools/fussball.mjs).
  const nr = t => t.ids || [t.id];
  const eigen = new Set(nr(team));
  const ids = new Set([...eigen, ...verein.flatMap(nr)]);
  const liga = team.klassen.map(id => D.klassen[id]).filter(istLiga);
  const aktuell = liga[liga.length - 1] || null;
  const eigene = [];
  for (const id of new Set([...team.klassen, ...verein.flatMap(t => t.klassen)])) {
    const k = D.klassen[id];
    for (const sp of k.spiele)
      if (ids.has(sp.h.id) || ids.has(sp.a.id))
        eigene.push({ ...sp, klasse: k.n, typ: k.typ, erg: k.ergebnisse, wir: ids.has(sp.h.id) ? sp.h.id : sp.a.id });
  }
  eigene.sort((a, b) => a.d.localeCompare(b.d));
  // Ein Spiel ohne Ergebnis gilt bis 3 h nach Anpfiff als „kommt noch“, danach als
  // „Ergebnis fehlt noch“ — sonst stünde ein gestriges Spiel ewig oben als nächstes.
  // Uhrzeit offen (00:00): erst am Tag danach (sonst wäre es ab 3 Uhr morgens am Spieltag „gespielt“).
  const kommend = eigene.filter(sp => !sp.gespielt && !istVorbei(sp, now));
  const gespielt = eigene.filter(sp => sp.gespielt || istVorbei(sp, now)).reverse();

  let status = null;
  if (aktuell) {
    const fertig = aktuell.spiele.length > 0 && aktuell.spiele.every(sp => sp.gespielt);
    const z = zonen(D.saison.id, aktuell.n);
    const zeile = aktuell.tabelle && aktuell.tabelle.find(r => eigen.has(r.id));
    if (fertig) {
      const { nr } = klasseVon(aktuell.n);
      let was = "";
      if (z && zeile && z.auf.includes(zeile.pl)) was = { art: "up", txt: `Platz ${zeile.pl} — Aufstieg in Klasse ${roem(nr - 1)}! 🎉` };
      else if (z && zeile && z.ab.includes(zeile.pl)) was = { art: "down", txt: `Platz ${zeile.pl} — es geht in Klasse ${roem(nr + 1)}.` };
      else if (z && zeile) was = { art: "", txt: `Platz ${zeile.pl} — bleibt in Klasse ${roem(nr)}.` };
      // Regeln für die Phase da, aber nicht für diese Klasse = letzte Klasse (Rundschreiben).
      else if (zeile && regelnVon(D.saison.id, aktuell.n)) was = { art: "", txt: `Platz ${zeile.pl}. Für diese Klasse hängen Auf- und Abstieg von den Anmeldungen ab.` };
      else if (zeile) was = { art: "", txt: `Platz ${zeile.pl}.` };
      const neuFehlt = !kommend.some(sp => sp.typ === "CC");
      status = { fertig, was, neuFehlt };
    }
  }
  return { team, ids, eigen, aktuell, frueher: liga.slice(0, -1).reverse(), kommend, gespielt, status };
}

// ---- Live (FuPa, data/live.json aus tools/fussball-live.mjs) ----
// Kasten nur, wenn das Live-Spiel zu diesem Reiter gehört, FuPa es als laufend oder beendet
// führt und die FLF noch kein Ergebnis hat — danach steht es normal bei den Ergebnissen.
// Höchstens 4 h nach Anstoß, falls die Action einmal hängen bleibt.
const LIVE_FENSTER = { vor: 15 * 60e3, nach: 180 * 60e3 };   // wie tools/fussball-live.mjs
// Endstand von FuPa bleibt stehen, bis die FLF ihr Ergebnis hat, höchstens 48 h (vom Nutzer, 23.10.2026:
// Seniors 3 um 20:00, um 23:00 war der Stand weg, die FLF noch leer).
const ENDE_FRIST = 48 * 3600e3;
function liveAnzeige(L, v, now) {
  if (!L || !v) return null;
  const sp = [...v.kommend, ...v.gespielt].find(s => s.id === L.flfId);
  if (!sp || (sp.gespielt && sp.hs != null)) return null;
  if (now > Date.parse(L.anstoss) + (L.section === "POST" ? ENDE_FRIST : 4 * 3600e3)) return null;
  if (L.section !== "LIVE" && L.section !== "POST") return null;
  // FuPa setzt ab Anpfiff von selbst „LIVE“, auch ohne Tickerer (19.10.2026, Seniors 2 gegen Titus:
  // kein Stand, kein Name). Dann bleibt der Spieltag-Kasten „Spiel läuft“ stehen.
  if (L.hs == null && L.as == null && !L.ticker && !(L.tore || []).length) return null;
  return { ...L, zeit: liveZeit(L, now), laeuft: L.section === "LIVE" };
}

// Minute aus dem letzten Abruf weitergezählt; über 45/90/105/120 hinaus „45+“ usw. (Nachspielzeit
// kennt nur der Tickerer, und das Weiterzählen soll nicht bei 97' stehen, wenn die Action hängt).
// Gesehen hat FuPa bisher „started“, „halftime“, „secondHalf“; für Verlängerung und
// Elfmeterschießen kennen wir die Namen noch nicht — darum nach Wortteilen statt genau.
function liveZeit(L, now) {
  if (L.section === "POST") return "Abpfiff";
  const p = String(L.period || "").toLowerCase();
  if (/penal|shoot/.test(p)) return "Elfmeterschießen";
  if (p.includes("halftime") || p.includes("break") || p.includes("pause")) return p === "halftime" ? "Halbzeit" : "Pause";
  if (L.minute == null) return "läuft";
  let m = L.minute;
  if (L.running && L.minuteAt) m += Math.max(0, Math.floor((now - Date.parse(L.minuteAt)) / 60e3));
  const verl = /overtime|extra/.test(p) || L.minute > 90;
  const deckel = p === "started" || p === "firsthalf" ? 45 : !verl ? 90 : L.minute <= 105 && !/second/.test(p) ? 105 : 120;
  const txt = m > deckel ? deckel + "+" : m + "'";
  return verl ? "Verlängerung " + txt : txt;
}

// Art des Tors aus FuPas `subtype`. Am 18.10.2026 in 11 Koeppchen-Spielen gesehen: goal_shoot
// (34×, normaler Schuss, kein Zusatz), goal_headed, penalty_foul, goal_scrounger, goal_free_kick,
// goal_own_goal, penalty_shootout, goal_distance_shoot. Nach Wortteilen, falls FuPa mehr kennt;
// Elfmeterschießen vor Elfmeter prüfen (beide enthalten „penalty“).
function torArt(art) {
  const a = String(art || "").toLowerCase();
  if (a.includes("own")) return "Eigentor";
  if (a.includes("shootout")) return "Elfmeterschießen";
  if (a.includes("penalty")) return "Elfmeter";
  if (a.includes("free")) return "Freistoß";
  if (a.includes("head")) return "Kopfball";
  if (a.includes("scrounger")) return "Abstauber";
  if (a.includes("distance")) return "Fernschuss";
  return "";
}

// Karten aus FuPas `subtype` (gesehen: card_red). Gelb-Rot vor Rot prüfen, der Name enthält beides.
// In 11 Spielen kam nur card_red vor — FuPa führt in `highlights` wohl nur Platzverweise.
function kartenArt(art) {
  const a = String(art || "").toLowerCase();
  if (a.includes("yellow") && a.includes("red")) return { zeichen: "🟨🟥", text: "Gelb-Rot" };
  if (a.includes("red")) return { zeichen: "🟥", text: "Rot" };
  if (a.includes("yellow")) return { zeichen: "🟨", text: "Gelb" };
  return { zeichen: "🃏", text: "Karte" };
}

// Tore, Karten und verschossene Elfmeter (vom Nutzer, 23.10.2026) in einer Liste, nach Minute (bei gleicher Minute Tor zuerst).
function ereignisListe(lv) {
  const tore = (lv.tore || []).map(t => ({ ...t, typ: "tor" }));
  const karten = (lv.karten || []).map(k => ({ ...k, typ: "karte" }));
  const fehl = (lv.fehl || []).map(k => ({ ...k, typ: "fehl" }));
  return [...tore, ...karten, ...fehl].sort((x, y) => x.min - y.min || x.plus - y.plus || (x.typ === "tor" ? -1 : 1));
}

// „Heute Spieltag“ (vom Nutzer gewünscht, für alle Reiter): das erste eigene Spiel heute (Tag in
// Luxemburg), solange es kein Ergebnis hat — längstens 3 h nach Anstoß. `begonnen` ab Anstoß.
const tagLux = ms => new Date(ms).toLocaleDateString("sv-SE", { timeZone: "Europe/Luxembourg" });
function spieltagHeute(v, now) {
  if (!v) return null;
  const sp = [...v.kommend, ...v.gespielt]
    .filter(s => tagLux(Date.parse(s.d)) === tagLux(now))
    .filter(s => !(s.gespielt && s.hs != null) && !istVorbei(s, now))
    .sort((a, b) => a.d.localeCompare(b.d))[0];
  // Uhrzeit offen: nie „Spiel läuft“, sonst stünde das ab Mitternacht da.
  return sp ? { sp, begonnen: !zeitOffen(sp) && now >= Date.parse(sp.d) } : null;
}

// Koeppi (Maskottchen, vom Verein angeregt, Plan vom Nutzer 22.10.2026): nur bei den Kinder-Reitern
// (U9, U11, U13, U15) und in „Unsere Woche“, nie bei den Seniors, nie im Live-Kasten.
// Nach der Altersklasse, nicht nach dem Namen: Kinder heißen seit neu m „MIN 1“, „SCO“ … (vom Verein).
const istKinder = v => ["U9", "U11", "U13", "U15"].includes(v?.team?.kat) || /^(U(9|11|13|15)|MIN|SCO|POU|PUP)\b/.test(v?.team?.reiter || "");
// Morgen ein eigenes Spiel? Dann am Vortag der Kasten „Morgen Spieltag!“ (vom Nutzer, Variante A).
function tagPlus(tag, n) { const [y, m, d] = tag.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
const tagNach = tag => tagPlus(tag, 1);
const tageZwischen = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
// Ein Spiel ohne Ergebnis gilt bis 3 h nach Anpfiff als „kommt noch“, mit offener Uhrzeit (00:00) bis
// Ende des Spieltags (Luxemburger Zeit).
const istVorbei = (sp, now) => zeitOffen(sp) ? tagLux(now) > tagLux(Date.parse(sp.d)) : now > Date.parse(sp.d) + 3 * 3600e3;
function spieltagMorgen(v, now) {
  if (!v) return null;
  const morgen = tagNach(tagLux(now));
  const sp = v.kommend.filter(s => tagLux(Date.parse(s.d)) === morgen).sort((a, b) => a.d.localeCompare(b.d))[0];
  return sp ? { sp } : null;
}

  const a = !ohne && tid != null && ausgang(sp, tid);
  const sc = !ohne && sp.gespielt && sp.hs != null ? `${sp.hs} : ${sp.as}` : "";
  const wirH = ids && ids.has(sp.h.id), wirA = ids && ids.has(sp.a.id);
  return `<div class="m">
    <div class="t h${wirH ? " wir" : ""}">${umbruch(anzeige(sp.h.n))}</div>
    <div class="sc ${sc ? (a || "") : "offen"}">${sc || (ohne && (sp.gespielt || istVorbei(sp, Date.now())) ? "gespielt" : sp.gespielt ? "–" : Date.parse(sp.d) < Date.now() ? "–" : "offen")}</div>
    <div class="t${wirA ? " wir" : ""}">${umbruch(anzeige(sp.a.n))}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
  </div>`;
}

function tabelleHtml(k, eigen) {
  if (!k.tabelle || !k.tabelle.length) return `<div class="muted">Für diese Klasse veröffentlicht die FLF keine Tabelle.</div>`;
  const z = zonen(D.saison.id, k.n);
  const rows = k.tabelle.map(r => {
    const cls = [eigen.has(r.id) ? "wir" : "", z && z.auf.includes(r.pl) ? "auf" : "", z && z.ab.includes(r.pl) ? "ab" : ""].join(" ");
    return `<tr class="${cls}"><td class="pl">${r.pl}</td><td class="tm">${umbruch(anzeige(r.n))}</td><td>${r.sp}</td>
      <td class="wide">${r.s}</td><td class="wide">${r.u}</td><td class="wide">${r.nl}</td>
      <td>${r.t}:${r.g}</td><td class="narrow">${r.t - r.g > 0 ? "+" : ""}${r.t - r.g}</td><td class="pk">${r.pkt}</td></tr>`;
  }).join("");
  const leg = z ? `<div class="leg">${z.auf.length ? `<span><i style="background:var(--good)"></i>Aufstieg${z.extra ? " (" + esc(z.extra) + ")" : ""}</span>` : ""}
      ${z.ab.length ? `<span><i style="background:var(--bad)"></i>Abstieg</span>` : ""}</div>` : "";
  return `<table><thead><tr><th>#</th><th>Mannschaft</th><th>Sp</th><th class="wide">S</th><th class="wide">U</th><th class="wide">N</th>
    <th>Tore</th><th class="narrow">±</th><th>Pkt</th></tr></thead><tbody>${rows}</tbody></table>${leg}`;
}

function alleSpieleHtml(k, ids) {
  return nachSpieltag(k.spiele).map(([tag, sp]) =>
    `<div class="tag">${tag ? "Spieltag " + tag : "Spiele"} · ${wann(sp[0].d, false)}</div>` +
    sp.map(s => spielZeile({ ...s, erg: k.ergebnisse }, ids)).join("")).join("");
}

function render() {
  const main = document.getElementById("main");
  if (!D) return;
  UMSCHALT = null;   // setzt heuteHtml, wenn ein Spieltag-Kasten steht
  const { tabs } = aufteilen(D);
  // Beim allerersten Öffnen „Unsere Woche“ (vom Nutzer, 20.10.2026), danach der zuletzt gewählte
  // Reiter (persist beim Umschalten). Gibt es den gemerkten Reiter nicht mehr, auch die Woche.
  const extra = extraReiter(D);
  if (!tabs.some(t => t.id === ST.team) && !extra.some(t => t.id === ST.team)) ST.team = "woche";
  const wTage = wocheTage(Date.now()), wAlle = wocheSpiele(D, wTage, Date.now());
  const heuteN = wAlle.filter(sp => tagLux(Date.parse(sp.d)) === tagLux(Date.now())).length;
  const liveN = liveZahl(Date.now());
  const wZahl = liveN ? `🔴 ${liveN} ${liveN === 1 ? "Spiel" : "Spiele"} gerade LIVE` : heuteN ? `heute ${heuteN} ${heuteN === 1 ? "Spiel" : "Spiele"}` : `${wAlle.length} ${wAlle.length === 1 ? "Spiel" : "Spiele"}`;
  document.getElementById("seg").innerHTML = `<button data-t="woche" class="woche${ST.team === "woche" ? " on" : ""}"><img alt="" src="${LOGO}">Unsere Woche · ${wZahl}<img alt="" src="${LOGO}"></button>` + [...tabs, ...extra].map(t =>
    `<button data-t="${t.id}" class="${t.id === ST.team ? "on" : ""}">${t.bild ? `<img alt="${esc(t.reiter)}" src="${FLF_LOGO}">` : esc(t.reiter || t.n)}</button>`).join("");
  if (ST.team == null) { main.innerHTML = `<div class="note">Keine Spiele gefunden.</div>`; return; }
  // Zahnrad = eigener Reiter (vom Nutzer, 21.10.2026). Wird nicht bei jedem Takt neu gebaut, damit
  // Haken und Knöpfe stehen bleiben; der gewählte Mannschafts-Reiter bleibt gemerkt.
  document.getElementById("zahnrad").classList.toggle("on", MITT_OFFEN);
  if (MITT_OFFEN) {
    document.querySelectorAll("#seg button.on").forEach(b => b.classList.remove("on"));
    document.getElementById("sub").textContent = "Mitteilungen";
    if (!document.getElementById("mitt")) { main.innerHTML = `<div id="mitt" class="mitt"></div>` + fuss(); mittHtml(); }
    return;
  }

  const now = Date.now();
  if (ST.team === "woche") {
    LIVE_SP = null; LIVE_POLL = false;
    document.getElementById("sub").textContent = "Unsere Woche · " + D.saison.n.replace("Saison ", "");
    main.innerHTML = wocheHtml(wTage, wAlle, now) + fuss();
    return;
  }
  if (ST.team === "bgl" || ST.team === "nati") {
    LIVE_SP = null; LIVE_POLL = false;   // natiHtml setzt beide, wenn ein Länderspiel läuft
    main.innerHTML = (ST.team === "bgl" ? bglHtml(now) : natiHtml(now)) + fuss();
    return;
  }
  const v = sicht(D, ST.team, now);
  const ids = v.ids, alter = v.team.alter || "";
  document.getElementById("sub").textContent = (alter ? alter + " · " : "") + D.saison.n.replace("Saison ", "");
  const art = sp => sp.typ === "CUP" ? "Pokal" : sp.typ === "FM" ? "Freundschaftsspiel" : "";
  let h = "";

  LIVE_SP = liveSpiel(v, now, D.fupa || {}, spaet);
  const lv = liveAnzeige(mitWorker(liveBasis(L, LIVE_SP), wFrisch(LIVE_SP)), v, now);
  LIVE_POLL = !!lv?.laeuft || imLiveFenster(v, now);   // nach Abpfiff (bis zum FLF-Ergebnis) nicht mehr jede Minute
  // Spieltag-Kasten, solange (noch) kein LIVE-Kasten da ist.
  const heute = !lv && spieltagHeute(v, now);
  const kinder = istKinder(v);
  if (heute) h += heuteHtml(heute, v.ids, { live: v.team.reiter === LIVE_REITER || !!(D.fupa || {})[heute.sp.id], pill: sp => sp.typ === "CUP" ? "Pokal" : "",
    ohneLive: "Das Ergebnis erscheint, sobald es eingetragen ist.", koeppi: kinder, motto: true,
    fupaUrl: (D.fupa || {})[heute.sp.id] ? "https://www.fupa.net/match/" + D.fupa[heute.sp.id]
      : L && L.flfId === heute.sp.id && L.url ? L.url : "https://www.fupa.net/club/fc-koeppchen" });
  const morgen = kinder && !heute && !lv && spieltagMorgen(v, now);
  if (morgen) h += morgenHtml(morgen, v.ids, sp => sp.typ === "CUP" ? "Pokal" : "");
  if (lv) h += liveHtml(lv, n => anzeige(n).startsWith("Koeppchen"), "offiziell zählt die FLF");

  if (v.status && v.status.was) {
    // Kinder: wartet die neue Klasse noch, steht der ruhige Koeppi rechts im Kasten.
    const ruhig = kinder && v.status.neuFehlt;
    h += `<div class="note ${v.status.was.art}${ruhig ? " mitk" : ""}">${ruhig ? "<div>" : ""}<b>${esc(v.aktuell.n)} ist beendet.</b> ${esc(v.status.was.txt)}` +
      (v.status.neuFehlt ? `<br><span class="muted">Die neue Klasse ist bei der FLF noch nicht eingetragen. Sobald das erste Spiel drinsteht, erscheint sie hier von selbst.</span>` : "") + `${ruhig ? "</div>" + koeppiBild("ruhig") : ""}</div>`;
  }

  h += `<section class="card"><div class="chead"><h2>Nächste Spiele</h2></div><div class="cbody">`;
  if (!v.kommend.length) h += kinder ? koeppiZeile("ruhig", "Noch keine Termine eingetragen.", "links") : `<div class="muted">Noch keine Termine eingetragen.</div>`;
  // Höchstens fünf — bei den Seniors stünde sonst die halbe Saison hier.
  const ZEIG = 5;
  v.kommend.slice(0, ZEIG).forEach((sp, i) => {
    const pokal = art(sp) ? `<span class="pill">${art(sp)}</span>` : "";
    if (i === 0) {
      h += `<div class="next"><div class="when">${esc(wann(sp.d))} <span class="muted" style="font-family:Barlow;font-size:14px;letter-spacing:0">${bisDahin(sp.d, now)}</span></div>
        ${spielZeile(sp, ids, `${sp.ort ? "📍 " + esc(sp.ort) : ""}${pokal}<br>${esc(sp.klasse)}`)}</div>`;
    } else h += spielZeile(sp, ids, `${esc(wann(sp.d))}${sp.ort ? " · 📍 " + esc(sp.ort) : ""}${pokal}`);
  });
  if (v.kommend.length > ZEIG)
    h += `<div class="muted" style="text-align:center;font-size:12.5px;margin-top:8px">+ ${v.kommend.length - ZEIG} weitere unter „Alle Spiele der Klasse“</div>`;
  if (v.team.datei) {
    // Abo statt Export: die Action schreibt kalender/<reiter>.ics bei jedem Lauf neu, das iPhone
    // holt sie selbst ab — verschobene Spiele wandern mit. webcal:// öffnet die Kalender-App.
    // Kinder mit zwei Mannschaften: ein gemeinsamer Kalender (vom Nutzer, 23.10.2026), z. B. „Minimes U13“.
    const kal = v.team.gruppe || { datei: v.team.datei, name: v.team.reiter };
    const url = KALENDER + kal.datei;
    h += `<a class="kal" href="${esc(url.replace(/^https:/, "webcal:"))}">📅 ${esc(kal.name)} im Kalender abonnieren</a>
      <details class="kalhilfe"><summary>Klappt nicht?</summary>
        Einstellungen → Kalender → Accounts → Account hinzufügen → Andere → <b>Kalenderabo hinzufügen</b>, dann diese Adresse:
        <code>${esc(url)}</code><button class="kopie" data-copy="${esc(url)}">Adresse kopieren</button>
      </details>`;
  }
  h += `</div></section>`;

  if (v.aktuell && !v.aktuell.ergebnisse && !v.aktuell.tabelle) {
    h += `<div class="note">In der ${esc(v.team.kat)} veröffentlicht die FLF keine Ergebnisse und keine Tabelle — hier stehen darum nur die Termine.</div>`;
  } else if (v.aktuell) {
    h += `<section class="card"><div class="chead"><h2>Tabelle</h2><div class="hint">${esc(v.aktuell.n)}</div></div>
      <div class="cbody">${tabelleHtml(v.aktuell, v.eigen)}</div></section>`;
  }

  h += `<section class="card"><div class="chead"><h2>${v.aktuell && !v.aktuell.ergebnisse ? "Bisherige Spiele" : "Unsere Ergebnisse"}</h2></div><div class="cbody">`;
  if (!v.gespielt.length) h += `<div class="muted">Noch nichts gespielt.</div>`;
  const nach = nachDemSpiel(v, now);
  if (nach) {
    const naechst = v.kommend[0];
    h += `<div class="streifen">${koeppiBild("rennend")}<div><b>Super gemacht, ${esc(v.team.reiter)}! 💪</b>${esc(nach.spruch)}${naechst ? `<br><span class="muted">Nächstes Spiel: ${esc(wann(naechst.d, false))}</span>` : ""}</div></div>`;
  }
  for (const sp of v.gespielt) {
    const pokal = art(sp) ? " · " + art(sp) : "";
    const fehlt = !sp.gespielt && sp.erg !== false ? " · Ergebnis noch nicht eingetragen" : "";
    h += spielZeile(sp, ids, `${esc(wann(sp.d, false))}${pokal}${sp.forfait ? (Date.parse(sp.d) > now ? " · Forfait, im Voraus gewertet" : " · Forfait") : ""}${sp.bem === "Arrêté" ? " · abgebrochen, gewertet" : ""}${fehlt}`);
  }
  h += `</div></section>`;

  if (v.aktuell) {
    h += `<details class="card"><summary><h2>Alle Spiele der Klasse</h2><span class="hint">${v.aktuell.spiele.length} Spiele</span></summary>
      <div class="cbody">${alleSpieleHtml(v.aktuell, ids)}</div></details>`;
  }
  for (const k of v.frueher) {
    h += `<details class="card"><summary><h2>Früher: ${esc(k.n.replace(alter, "").trim() || k.n)}</h2></summary>
      <div class="cbody">${tabelleHtml(k, v.eigen)}<div style="margin-top:10px">${alleSpieleHtml(k, ids)}</div></div></details>`;
  }

  main.innerHTML = h + fuss();
}

function fuss() {
  const stand = new Date(D.stand).toLocaleString("de-DE", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
  const quelle = ST.team === "nati" ? `<a href="https://www.fupa.net/team/luxemburg-m1" target="_blank" rel="noopener">FuPa</a>`
    : `<a href="https://extranet.flf.lu/match" target="_blank" rel="noopener">extranet.flf.lu</a>`;
  return `<footer>Daten von ${quelle}, zuletzt geändert ${esc(stand)}<br>
    Aktualisiert jeden Tag um 7:00 und 23:30 Uhr, Mo–Fr zusätzlich um 22:15 Uhr, Sa/So von 8 bis 22 Uhr alle 15 Minuten.
    <br><button class="teilen" id="teilen">↗︎ App teilen</button>
    <div class="von" id="von">Gemacht von Laurent R. für den FC Koeppchen <img alt="" src="${LOGO}"></div>${eigenesGeraet() ? `<div style="font-size:11px">Dieses Gerät zählt nicht in der Statistik mit.</div>` : ""}
    <div style="margin-top:6px;font-size:11px">Fassung ${FASSUNG}</div></footer>`;
}

// „Heute Spieltag“ (Mannschaften und Roude Léiw).
function heuteHtml(heute, ids, { live, pill, ohneLive, koeppi, motto, fupaUrl }) {
  const sp = heute.sp, zeit = wann(sp.d).split(" · ")[1];
  const min = !heute.begonnen && minutenBisAnpfiff(sp, Date.now());
  // Nächster Wechsel des Kastens (Countdown an, Anpfiff) — der Takt unten baut dann neu.
  if (!heute.begonnen && zeit) UMSCHALT = Date.parse(sp.d) - (min ? 0 : COUNTDOWN_MS);
  // 15 min nach Anpfiff ohne Tickerer: nicht weiter auf den Ticker vertrösten (vom Nutzer, 19.10.2026).
  const keinTicker = heute.begonnen && Date.now() >= Date.parse(sp.d) + 15 * 60e3;
  if (heute.begonnen && live && !keinTicker) UMSCHALT = Date.parse(sp.d) + 15 * 60e3;
  const titel = heute.begonnen ? "Spiel läuft" : min ? "Gleich geht's los! ⚽" : "Heute Spieltag! ⚽";
  const oben = heute.begonnen ? esc(zeit ? "seit " + zeit : "heute")
    : min ? `<span id="countdown" data-d="${esc(sp.d)}">${countdownText(min)}</span> · ${esc(zeit)}`
    : esc(zeit ? "Anstoß " + zeit : "Uhrzeit noch offen");
  // Nicht „startet mit dem Anpfiff“: bei den Reserven tickert nicht immer jemand (vom Nutzer).
  const unten = heute.begonnen
    ? (!live ? ohneLive : keinTicker
        ? "Bisher tickert niemand bei FuPa – heute gibt es wohl keinen Liveticker. Das Ergebnis kommt, sobald die FLF es einträgt."
        : "Der Liveticker erscheint hier, falls bei FuPa jemand tickert.")
    : (live ? "Liveticker, wenn verfügbar — sobald bei FuPa jemand tickert." : "");
  const p = pill(sp);
  // Kinder (vom Nutzer, 22.10.2026): am Spieltag vor dem Anpfiff Fuß auf dem Ball und Faust hoch, ab
  // „Gleich geht's los!“ und im Spiel Ball unterm Arm und Faust. Die Trinkflasche gehört zum Vortag.
  const kz = !koeppi ? "" : (!heute.begonnen && !min) || !zeit
    ? koeppiZeile("fuss-auf-ball", "Trinkflasche nicht vergessen! 😉", "", motto)
    : koeppiZeile("ball-faust", heute.begonnen ? "Daumen drücken! 🤞" : "Viel Spaß und viel Glück! 💪", "", motto);
  return `<section class="card heute"><div class="chead"><h2>${titel}</h2>${p ? `<span class="pill">${esc(p)}</span>` : ""}</div><div class="cbody">
    <div class="wann">${oben}</div>
    <div class="m" style="border:0"><div class="t h${ids.has(sp.h.id) ? " wir" : ""}">${umbruch(anzeige(sp.h.n))}</div>
    <div class="sc offen">–</div><div class="t${ids.has(sp.a.id) ? " wir" : ""}">${umbruch(anzeige(sp.a.n))}</div></div>
    ${sp.ort ? `<div class="wo">📍 ${esc(sp.ort)}</div>` : ""}
    ${unten ? `<div class="zusatz">${fupaLink(esc(unten), live && fupaUrl)}</div>` : ""}${kz}${motto && !koeppi ? MOTTO : ""}
    </div></section>`;
}
// „FuPa“ im Hinweistext schon vor dem Ticker als Link (vom Nutzer, 23.10.2026): zum Spiel bei FuPa, wenn der
// Slug bekannt ist, sonst zur Vereinsseite.
const fupaLink = (html, url) => url ? html.replace("FuPa", `<a href="${esc(url)}" target="_blank" rel="noopener">FuPa</a>`) : html;
// Vereinsmotto (vom Nutzer, 23.10.2026) unten in den Kästen „Morgen/Heute Spieltag“ aller Mannschaften, nicht bei Roude Léiw.
const MOTTO = `<div class="motto">#mirvunderkoeppchen</div>`;
const koeppiBild = n => `<img class="koeppi" alt="Koeppi" src="bilder/k-${n}.png">`;
const koeppiZeile = (n, txt, cls = "", motto = false) => `<div class="kzeile${cls ? " " + cls : ""}">${koeppiBild(n)}<span>${esc(txt)}${motto ? `<span class="motto">#mirvunderkoeppchen</span>` : ""}</span></div>`;
// „Morgen Spieltag!“ (nur Kinder-Reiter, Vortag).
function morgenHtml(m, ids, pill) {
  const sp = m.sp, zeit = wann(sp.d).split(" · ")[1], p = pill(sp);
  return `<section class="card heute"><div class="chead"><h2>Morgen Spieltag! ⚽</h2>${p ? `<span class="pill">${esc(p)}</span>` : ""}</div><div class="cbody">
    <div class="wann">${esc(zeit ? "Anstoß " + zeit : "Uhrzeit noch offen")}</div>
    <div class="m" style="border:0"><div class="t h${ids.has(sp.h.id) ? " wir" : ""}">${umbruch(anzeige(sp.h.n))}</div>
    <div class="sc offen">–</div><div class="t${ids.has(sp.a.id) ? " wir" : ""}">${umbruch(anzeige(sp.a.n))}</div></div>
    ${sp.ort ? `<div class="wo">📍 ${esc(sp.ort)}</div>` : ""}
    ${koeppiZeile("trinkflasche", "Trinkflasche nicht vergessen! 😉", "", true)}
    </div></section>`;
}

// LIVE-Kasten (Seniors 1–3 und Roude Léiw). `wir(name)`: welche Seite fett steht.
function liveHtml(lv, wir, zusatz) {
  const tore = ereignisListe(lv).map(e => {
    const min = `${e.min}${e.plus ? "+" + e.plus : ""}.`;
    const wer = `<span class="muted">(${esc(anzeige(e.heim ? lv.h : lv.a))})</span>`;
    if (e.typ === "karte") {
      const k = kartenArt(e.art);
      return `<li>${k.zeichen} ${min} ${esc(e.name || "")} · <b>${k.text}</b> ${wer}</li>`;
    }
    if (e.typ === "fehl") return `<li>❌ ${min} ${esc(e.name || "")}${e.name ? " · " : ""}<b>Elfmeter verschossen</b> ${wer}</li>`;
    const art = torArt(e.art);
    return `<li>⚽ ${min} ${esc(e.name || "Tor")}${art ? ` · <b>${art}</b>` : ""} ${wer}</li>`;
  }).join("");
  return `<section class="card live"><div class="chead"><h2>${lv.laeuft ? `<span class="punkt"></span>Live` : "Endstand laut FuPa"}</h2>
    <div class="hint">${esc(wann(lv.anstoss))}</div></div><div class="cbody">
    <div class="m" style="border:0"><div class="t h${wir(lv.h) ? " wir" : ""}">${umbruch(anzeige(lv.h))}</div>
    <div class="stand">${lv.hs ?? "–"} : ${lv.as ?? "–"}</div><div class="t${wir(lv.a) ? " wir" : ""}">${umbruch(anzeige(lv.a))}</div></div>
    <div class="zeit" id="liveZeit">${esc(lv.zeit)}</div>
    ${tore ? `<ul class="tore">${tore}</ul>` : ""}
    <div class="quelle">Liveticker von <a href="${esc(lv.url)}" target="_blank" rel="noopener">FuPa</a>${lv.ticker ? " (" + esc(lv.ticker) + ")" : ""}${lv.laeuft ? " · " + (WORKER_URL && W ? "fast live" : "bis zu 7 min Verzögerung") : ""}${zusatz ? " · " + zusatz : ""}</div>
    </div></section>`;
}

// Live in der Woche und im Knopf: alle Spiele mit möglichem Ticker im Live-Fenster (Seniors 1–3),
// je Spiel ein Worker-Stand in WS (FLF-Spiel-ID → Antwort). Unabhängig vom offenen Reiter.
const WS = new Map();
// Endstände (FuPa „POST“) überstehen das Schließen der App, bis die FLF ihr Ergebnis hat (ENDE_FRIST).
const ENDE_KEY = KEY + "_ende";
try {
  const alt = JSON.parse(localStorage.getItem(ENDE_KEY) || "{}");
  const frisch = Object.entries(alt).filter(([, w]) => Date.now() - Date.parse(w.abgerufen || 0) < ENDE_FRIST);
  for (const [id, w] of frisch) WS.set(+id, w);
  // Ältere gleich wegräumen, damit sich nichts ansammelt.
  if (frisch.length < Object.keys(alt).length) localStorage.setItem(ENDE_KEY, JSON.stringify(Object.fromEntries(frisch)));
} catch (e) {}
function endeMerken(w) {
  if (w.section !== "POST") return;
  if (!WS.has(w.fuer) || (WS.get(w.fuer).abgerufen || "") < (w.abgerufen || "")) WS.set(w.fuer, w);
  try {
    const o = {};
    for (const [id, x] of WS) if (x.section === "POST") o[id] = x;
    localStorage.setItem(ENDE_KEY, JSON.stringify(o));
  } catch (e) {}
}
// Nach dem Live-Fenster: einmal je Sitzung nachfragen; mit bekanntem Endstand gar nicht mehr.
const SPAET_VERSUCHT = new Set();
const endeBekannt = sp => WS.get(sp.id)?.section === "POST" || (L && L.flfId === sp.id && L.section === "POST");
const spaet = sp => endeBekannt(sp) || !SPAET_VERSUCHT.has(sp.id);
const imFenster = (sp, now) => now >= Date.parse(sp.d) - LIVE_FENSTER.vor && now <= Date.parse(sp.d) + LIVE_FENSTER.nach;

  else if (Notification.permission === "denied") h = `<p>Mitteilungen sind für die App ausgeschaltet. Einschalten unter
    Einstellungen → Mitteilungen → FC Koeppchen.</p>`;
  else {
    const r = await swReg().catch(() => null);
    const abo = r && await r.pushManager.getSubscription().catch(() => null);
    const w = mWahl();
    // Je Mannschaft ein Haken; angehakt klappen darunter ihre Mitteilungen auf, jede einzeln (vom Nutzer).
    const mannschaft = r => {
      const an = !!w.je[r], arten = mArtenFuer(r);
      const kopf = `<label class="haken team"><input type="checkbox" data-t="${esc(r)}"${an ? " checked" : ""}> ${esc(r === "Woche" ? "Unsere Woche (montags 10 Uhr)" : r)}</label>`;
      if (!an || r === "Woche") return `<div class="mteam">${kopf}</div>`;
      return `<div class="mteam">${kopf}<div class="marten">${arten.map(k =>
        `<label class="haken"><input type="checkbox" data-t="${esc(r)}" data-a="${k}"${w.je[r].includes(k) ? " checked" : ""}> ${esc(mArtText(r, k))}</label>`).join("")}</div></div>`;
    };
    h = abo && Notification.permission === "granted"
      ? `<p>✓ Mitteilungen sind auf diesem Gerät erlaubt. Nachts (23–7 Uhr) kommt nichts, das wartet bis morgens.</p>
         ${mAufraeumen()}<h3 class="mh">Meine Mannschaften</h3><p class="klein">Mannschaft anhaken, dann darunter wählen, was von ihr kommen soll.</p>
         ${mReiter().map(mannschaft).join("")}
         <button class="knopf" id="mTest">Test-Mitteilung senden</button>
         <button class="knopf zweit" id="mAus">Abmelden</button>`
      : `<p>Dein Handy fragt einmal, ob die App Mitteilungen schicken darf. Danach wählst du Mannschaften und Arten aus.</p>
         <button class="knopf" id="mAn">Mitteilungen erlauben</button>`;
  }
  box.innerHTML = `<section class="card"><div class="chead"><h2>Mitteilungen</h2></div><div class="cbody">${h}
    <div class="stand" id="mStand">${esc(MITT_STAND)}</div></div></section>`;
}
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const ANDROID = /Android/.test(navigator.userAgent);
const APP_ADRESSE = "fckoeppchen.github.io";
function installHtml() {
  const iphone = `<ol class="schritte"><li>Die App in <b>Safari</b> öffnen${IOS ? "" : `: <b>${APP_ADRESSE}</b>`}.</li>
    <li>Unten auf <b>Teilen</b> tippen (Viereck mit Pfeil nach oben ⬆︎).</li>
    <li><b>„Zum Home-Bildschirm“</b> wählen (evtl. erst „Mehr“ antippen), dann <b>„Hinzufügen“</b>.</li>
    <li>FC Koeppchen ab jetzt <b>vom Home-Bildschirm</b> öffnen und dort auf ⚙️ tippen.</li></ol>`;
  const android = `<ol class="schritte"><li>Die App in <b>Chrome</b> öffnen${ANDROID ? "" : `: <b>${APP_ADRESSE}</b>`}.</li>
    <li>Oben rechts auf <b>⋮</b> tippen, dann <b>„App installieren“</b> (oder „Zum Startbildschirm hinzufügen“ → „Installieren“).</li>
    <li>FC Koeppchen ab jetzt <b>vom Startbildschirm</b> öffnen und dort auf ⚙️ tippen.</li></ol>`;
  if (ANDROID) return `<p>Um Mitteilungen zu erhalten, bitte die App auf dem Handy <b>installieren</b> — im Browser gibt es keine. So geht's:</p>${android}`;
  if (IOS) return `<p>Um Mitteilungen zu erhalten, bitte die App auf dem iPhone <b>installieren</b> — im Browser gibt es keine. So geht's:</p>${iphone}
    <p class="klein">Braucht iOS 16.4 oder neuer. Die App vom Home-Bildschirm hat einen eigenen Speicher: gewählter Reiter usw. fangen dort neu an.</p>`;
  return `<p>Mitteilungen kommen aufs <b>Handy</b>. Um sie zu erhalten, bitte die App dort installieren:</p>
    <h3 class="mh">iPhone</h3>${iphone}<h3 class="mh">Android</h3>${android}`;
}
// Auswahl (Stufe 2, je Mannschaft einzeln, vom Nutzer 21.10.2026): { je: { "U13 2": ["tabelle"], … } },
// gemerkt auf dem Handy und beim Worker (?push=wahl). Jede Mannschaft zeigt nur, was es bei ihr gibt.
const M_ART_TEXT = { heute: "Heute Spiel (10 Uhr)", spieltag: "Spieltag komplett", tabelle: "Tabelle aktualisiert",
  uhrzeit: "Uhrzeit steht fest (wenn vorher keine eingetragen war)", neu: "Neue Phase / neues Spiel", ticker: "Liveticker läuft", halbzeit: "Halbzeitstand (nur mit Ticker)", ende: "Endstand", woche: "Neue Woche",
  tor: "Tore (fast live, nur mit Ticker)" };
const mKat = r => (D?.teams || []).find(t => t.reiter === r || t.gruppe?.name === r)?.kat || r;
function mArtenFuer(r) {
  const k = mKat(r);
  if (r === "Woche") return ["woche"];
  if (r === "BGL") return ["spieltag"];
  const tor = mTore() ? ["tor"] : [];
  if (r === "Roude Léiw") return ["heute", "ticker", "halbzeit", ...tor, "ende"];
  // Uhrzeit nur bei U9/U11, und nur wenn vorher keine da war (vom Nutzer: geänderte Zeiten gibt der Trainer durch).
  if (k === "Seniors") return ["heute", "tabelle", "ticker", "halbzeit", ...tor, "ende"];
  if (k === "U13" || k === "U15") return ["heute", "neu", "spieltag", "tabelle"];
  return ["heute", "uhrzeit"];   // U9, U11: die FLF zeigt keine Ergebnisse
}
const mArtText = (r, k) => k === "heute" && mKat(r) !== "Seniors" && r !== "Roude Léiw" ? "Morgen Spiel (Vorabend 19 Uhr)" : M_ART_TEXT[k];
// Kinder als Altersklasse („Minimes U13“), Seniors einzeln (vom Nutzer, 23.10.2026: die Kinder werden jede
// Woche neu auf 1/2 verteilt). Die Titel der Mitteilungen nennen weiter die Mannschaft.
const mReiter = () => [...new Set((D?.teams || []).filter(t => t.reiter).map(t => t.gruppe?.name || t.reiter)), "BGL", "Roude Léiw", "Woche"];
// Alte Auswahl je Kinder-Mannschaft („U13 2“) auf die Altersklasse umschreiben, Arten zusammen.
function mGruppiert(je) {
  if (!D?.teams) return je;
  const zu = new Map(D.teams.filter(t => t.reiter && t.gruppe).map(t => [t.reiter, t.gruppe.name])), aus = {};
  for (const [r, l] of Object.entries(je)) { const g = zu.get(r) || r; aus[g] = [...new Set([...(aus[g] || []), ...l])]; }
  return aus;
}
function mWahl() {
  try {
    const w = JSON.parse(localStorage.getItem(KEY + "_mwahl"));
    // Haken, die es bei einer Mannschaft nicht (mehr) gibt (z. B. Uhrzeit bei den Seniors bis Fassung k), fallen weg.
    if (w && w.je && typeof w.je === "object")
      return { je: Object.fromEntries(Object.entries(mGruppiert(w.je)).map(([r, l]) => [r, l.filter(k => mArtenFuer(r).includes(k))])) };
    // Alte Auswahl (eine Liste Mannschaften, eine Liste Arten für alle) übernehmen.
    if (w && Array.isArray(w.teams) && Array.isArray(w.arten))
      return { je: mGruppiert(Object.fromEntries(w.teams.map(r => [r, mArtenFuer(r).filter(k => k === "woche" || w.arten.includes(k))]))) };
  } catch (e) {}
  return { je: {} };
}
// Weicht die gespeicherte Auswahl von der bereinigten ab, einmal neu speichern (auch beim Worker).
function mAufraeumen() {
  let roh = null; try { roh = localStorage.getItem(KEY + "_mwahl"); } catch (e) {}
  const sauber = JSON.stringify(mWahl());
  if (roh && roh !== sauber) { try { localStorage.setItem(KEY + "_mwahl", sauber); } catch (e) {} setTimeout(mWahlSenden, 0); }
  return "";
}
async function mWahlSenden() {
  const reg = await swReg(), abo = reg && await reg.pushManager.getSubscription();
  if (!abo) return;
  const a = await pushPost("wahl", { endpoint: abo.endpoint, ...mWahl() }).catch(() => ({ ok: false }));
  MITT_STAND = a.ok ? "Gespeichert." : "Speichern ging nicht (" + (a.status || "?") + ").";
  const st = document.getElementById("mStand"); if (st) st.textContent = MITT_STAND;
}
document.addEventListener("change", e => {
  const c = e.target.closest("#mitt input[type=checkbox][data-t]");
  if (!c) return;
  const w = mWahl(), r = c.dataset.t, k = c.dataset.a;
  if (!k) { if (c.checked) w.je[r] = mArtenFuer(r).filter(x => x !== "tor"); else delete w.je[r]; }   // Mannschaft an: alles außer Tore (bewusst wählen, vom Nutzer)
  else { w.je[r] = (w.je[r] || []).filter(x => x !== k); if (c.checked) w.je[r].push(k); }
  try { localStorage.setItem(KEY + "_mwahl", JSON.stringify(w)); } catch (x) {}
  if (!k) mittHtml().then(mWahlSenden); else mWahlSenden();
});
async function mittAn() {
  // Erst fragen, direkt im Tippen — iOS lässt die Frage nur so zu.
  const erlaubt = await Notification.requestPermission();
  if (erlaubt !== "granted") { MITT_STAND = "Nicht erlaubt."; return mittHtml(); }
  MITT_STAND = "Melde an …"; mittHtml();
  try {
    const reg = await navigator.serviceWorker.register("sw.js", { scope: SW_SCOPE });
    await navigator.serviceWorker.ready;
    const { schluessel } = await fetch(WORKER_URL + "?push=schluessel").then(r => r.json());
    const roh = Uint8Array.from(atob(schluessel.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((schluessel.length + 3) % 4)), c => c.charCodeAt(0));
    const abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: roh });
    const a = await pushPost("anmelden", abo.toJSON());
    if (a.ok) await pushPost("wahl", { endpoint: abo.endpoint, ...mWahl() }).catch(() => {});
    // Höchstzahl erreicht (vom Nutzer, 23.10.2026: schrittweise freigeben): Abo wieder lösen, freundlich vertrösten.
    if (a.status === 409) await abo.unsubscribe().catch(() => {});
    MITT_STAND = a.ok ? "Angemeldet. Jetzt Mannschaften anhaken und „Test-Mitteilung senden“ tippen."
      : a.status === 409 ? "Mitteilungen gibt es bald für alle – im Moment sind alle Plätze vergeben. Bitte in ein paar Tagen nochmal versuchen."
      : "Anmelden beim Worker ging nicht (" + a.status + ").";
  } catch (e) { MITT_STAND = "Fehler: " + e.message; }
  mittHtml();
}
async function mittTest() {
  MITT_STAND = "Sende …"; mittHtml();
  try {
    const abo = await (await swReg()).pushManager.getSubscription();
    const a = await pushPost("test", { endpoint: abo.endpoint });
    MITT_STAND = a.ok ? "Gesendet — sollte gleich oben erscheinen. Tipp sie an, dann öffnet sich die App."
      : a.status === 429 ? "Bitte 20 Sekunden warten." : a.status === 404 ? "Worker kennt dieses Gerät nicht — einmal Abmelden und neu erlauben."
      : "Senden ging nicht (" + (a.status || "?") + ").";
  } catch (e) { MITT_STAND = "Fehler: " + e.message; }
  mittHtml();
}
document.addEventListener("click", e => {
  if (e.target.closest("#zahnrad")) { MITT_OFFEN = !MITT_OFFEN; MITT_STAND = ""; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("#mAn, #mTest, #mAus");
  if (!b) return;
  if (b.id === "mAn") mittAn();
  else if (b.id === "mTest") mittTest();
  else { MITT_STAND = "Abgemeldet."; swAufraeumen().then(mittHtml); }
});
function zahnradZeigen() { document.getElementById("zahnrad").hidden = !mtest(); }
let LOGO_TIPPS = [];
document.getElementById("logo").addEventListener("click", async () => {
  const t = Date.now();
  LOGO_TIPPS = [...LOGO_TIPPS.filter(x => t - x < 4000), t];

  if (an ? !code : !confirm("Mitteilungen-Test ausschalten und auf diesem Gerät abmelden?")) return;
  try { if (an) localStorage.setItem(KEY + "_mtest", code); else localStorage.removeItem(KEY + "_mtest"); } catch (e) {}

});
zahnradZeigen();
if (!mtest()) swAufraeumen();   // Rückweg: ohne Merker kein Service Worker, kein Abo

document.getElementById("logo").src = LOGO;
load();
try { D = JSON.parse(localStorage.getItem(KEY + "_data") || "null"); } catch (e) {}

aktualisieren().finally(zaehle);   // nach dem Laden, damit der Reiter bekannt ist
