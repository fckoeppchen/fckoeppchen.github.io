<style>
  :root{
    /* Vereinsfarben: weiss, schwarz, ein bisschen Grün (das Türkis aus dem Logo). */
    --bg:#f3f4f3; --panel:#ffffff; --panel2:#f6f7f6; --line:#e1e4e2;
    --text:#111111; --muted:#6b716e; --accent:#1fa88c; --accentT:#0f7a65;
    --head:#111111; --good:#1fa88c; --bad:#d9485a;
  }
  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:none;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;transform:translateZ(0)}
  /* Reiter-Leiste eigenes sticky-Element unter dem Kopf: beim Runterscrollen schiebt sie sich hinter den Kopf
     (nur transform, kein Sprung im Inhalt — iOS kennt kein Scroll-Anchoring), Hochscrollen holt sie zurück
     (vom Nutzer, 26.10.2026). Der grüne Strich bleibt stehen. */
  #leiste{position:sticky;top:var(--kopfH,62px);z-index:19;background:var(--head);border-bottom:5px solid var(--accent);transition:transform .85s cubic-bezier(.45,0,.25,1);will-change:transform}
  #leiste .wrap{padding-top:0}
  #leiste.weg{transform:translateY(calc(5px - 100%));pointer-events:none}
  .wrap{max-width:720px;margin:0 auto;padding:10px 14px}
  .top{display:flex;align-items:center;gap:10px}
  .top img{width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
  h1{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;margin:0;font-size:28px;color:#fff;line-height:1.05}
  .sub{color:#b9bfbc;font-size:12.5px;margin-top:1px}
  /* Reiter im Raster: acht passen in zwei Reihen à vier, auch auf dem kleinen iPhone. */
  /* 60 Spalten: geht in 4 (Handy) und 6 (ab 600 px) auf. Jeder Knopf bekommt seine Breite (--sp/--spd) aus
     reiterBreiten(); die letzte Reihe teilt sich den Platz gleichmäßig (vom Nutzer, 25.10.2026). */
  .seg{display:grid;grid-template-columns:repeat(60,1fr);gap:1px;background:#333;border:1px solid #333;border-radius:10px;overflow:hidden}
  .seg button{background:#222;white-space:nowrap;color:#b9bfbc;border:0;padding:9px 10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px}
  .seg button{grid-column:span var(--sp,15)}
  .seg button img{height:28px;display:block;margin:-6px auto}
  .seg button img.jk{background:#fff;border-radius:5px;padding:1px 4px}
  .seg button.on{background:#fff;color:#111}
  @media (min-width:600px){.seg button{grid-column:span var(--spd,10)}}
  .seg button.woche{grid-column:1/-1 !important;display:flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase;letter-spacing:.6px}
  .seg button.woche img{height:22px;margin:-4px 0;display:inline-block}
  .wzus{font-size:15px;font-weight:600;text-align:center}
  .wzeile{cursor:pointer}
  .pill.wteam{margin-left:0;background:var(--accentT);font-size:14px;padding:3px 10px;vertical-align:1px}
  .wzugleich{color:#b45309;font-weight:600}
  .wlive .sc{background:#d4001a !important;color:#fff !important}
  .wlivetxt{color:#d4001a;font-weight:700}
  main{max-width:720px;margin:0 auto;padding:4px 12px 60px}

  .card{background:var(--panel);border:2px solid var(--accent);border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}

<script>
// ==== Logik (ohne DOM, wird von test/fussball.mjs ausgeschnitten) ====

// Auf- und Abstieg nach Phase 1 2026-2027, Rundschreiben der FLF (vom Nutzer als Bild):
// Klasse I: 5./6. runter. II und III: 1. hoch, 5./6. runter. IV: 1./2. hoch, 5./6. runter.
// V: 1. jeder Serie und der beste 2. hoch. Die letzte Klasse (bei U13 Klasse VI) hängt von
// den Anmeldungen ab — dort wird nichts markiert, statt etwas zu behaupten.
// Für Phase 2 gibt es noch keine Regeln: neue Phase → neue Zeilen hier.
// Gilt für U13 und U15 (U15: derselbe Wortlaut, vom Nutzer als Text nachgereicht). Für die
// anderen Altersklassen liegt kein Rundschreiben vor, dort wird nichts markiert.
// Schlüssel: Saison, Altersklasse, Phase.
const PHASE1_2026 = {
  1: { auf: [], ab: [5, 6] },
  2: { auf: [1], ab: [5, 6] },
  3: { auf: [1], ab: [5, 6] },
  4: { auf: [1, 2], ab: [5, 6] },
  5: { auf: [1], ab: [], extra: "dazu der beste Zweite aller Serien" },
};
const REGELN = {
  "20262027 U13 Phase 1": PHASE1_2026,
  "20262027 U15 Phase 1": PHASE1_2026,
};

function klasseVon(name) {
  const k = /\bCl\s*(\d+)/i.exec(name), p = /Phase\s*(\d+)/i.exec(name), a = /^(W?U\d+)\b/.exec(name);
  return { nr: k ? +k[1] : null, phase: p ? +p[1] : null, kat: a ? a[1] : null };
}

// Regeln der ganzen Phase (alle Klassen) oder null.
function regelnVon(saisonId, name) {
  const { kat, phase } = klasseVon(name);
  return REGELN[`${saisonId} ${kat} Phase ${phase}`] || null;
}

// → {auf, ab, extra} oder null, wenn für diese Klasse keine Regel bekannt ist.
function zonen(saisonId, name) {
  const r = regelnVon(saisonId, name), { nr } = klasseVon(name);
  return (r && nr && r[nr]) || null;
}

// Sicht einer Mannschaft auf ein Spiel: s/u/n oder null, solange kein Ergebnis da ist.
function ausgang(sp, tid) {
  if (!sp.gespielt || sp.hs == null || sp.as == null) return null;
  const wir = sp.h.id === tid ? sp.hs : sp.as, die = sp.h.id === tid ? sp.as : sp.hs;
  return wir > die ? "s" : wir < die ? "n" : "u";
}

const istLiga = k => k.typ === "CC";
const ROEM = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
const roem = n => ROEM[n] || String(n);

// Mannschaften mit Ligaspielen bekommen einen Reiter. Welche Pokalmannschaften (ohne Liga)
// zu welchem Reiter gehören, legt der Abruf fest (`mit`, tools/fussball.mjs) — dieselbe
// Regel gilt dort für den Kalender.
function aufteilen(D) {
  const tabs = D.teams.filter(t => t.klassen.some(id => istLiga(D.klassen[id])));
  const verein = D.teams.filter(t => !tabs.includes(t));
  return { tabs, verein };
}

// In Zeilen und Tabelle: „FC Koeppchen Wormeldange I“ → „Koeppchen I“, sonst bricht
// das Ergebnis auf dem iPhone um. Gegner bleiben, wie die FLF sie schreibt.
const anzeige = n => n.replace(/^FC Koeppchen Wormeldange\b/, "Koeppchen");
// Umbruch nach „/“ statt mitten im Wort (ENT Mensdorf/Canach/Munsbach I).
const umbruch = s => esc(s).replace(/\//g, "/<wbr>");

// Alles, was ein Reiter zeigt — reine Daten, gerendert wird unten.
function sicht(D, tid, now) {
  const team = D.teams.find(t => t.id === tid);
  const verein = D.teams.filter(t => (team.mit || []).includes(t.id));
  // Alle FLF-Nummern: die Mannschaft kann je Phase eine andere haben (tools/fussball.mjs).
  const nr = t => t.ids || [t.id];
  const eigen = new Set(nr(team));
  const ids = new Set([...eigen, ...verein.flatMap(nr)]);
  const liga = team.klassen.map(id => D.klassen[id]).filter(istLiga);
  const aktuell = liga[liga.length - 1] || null;
  const eigene = [];
  for (const id of new Set([...team.klassen, ...verein.flatMap(t => t.klassen)])) {
    const k = D.klassen[id];
    for (const sp of k.spiele)
      if (ids.has(sp.h.id) || ids.has(sp.a.id))
        eigene.push({ ...sp, klasse: k.n, typ: k.typ, erg: k.ergebnisse && !["U7", "U9", "U11"].includes(team.kat), wir: ids.has(sp.h.id) ? sp.h.id : sp.a.id });
  }
  eigene.sort((a, b) => a.d.localeCompare(b.d));
  // Ein Spiel ohne Ergebnis gilt bis 3 h nach Anpfiff als „kommt noch“, danach als
  // „Ergebnis fehlt noch“ — sonst stünde ein gestriges Spiel ewig oben als nächstes.
  // Uhrzeit offen (00:00): erst am Tag danach (sonst wäre es ab 3 Uhr morgens am Spieltag „gespielt“).
  const kommend = eigene.filter(sp => !sp.gespielt && !istVorbei(sp, now));
  const gespielt = eigene.filter(sp => sp.gespielt || istVorbei(sp, now)).reverse();

  let status = null;
  if (aktuell) {
    const fertig = aktuell.spiele.length > 0 && aktuell.spiele.every(sp => sp.gespielt);
    const z = zonen(D.saison.id, aktuell.n);
    const zeile = aktuell.tabelle && aktuell.tabelle.find(r => eigen.has(r.id));
    if (fertig) {
      const { nr } = klasseVon(aktuell.n);
      let was = "";
      if (z && zeile && z.auf.includes(zeile.pl)) was = { art: "up", txt: `Platz ${zeile.pl} — Aufstieg in Klasse ${roem(nr - 1)}! 🎉` };
      else if (z && zeile && z.ab.includes(zeile.pl)) was = { art: "down", txt: `Platz ${zeile.pl} — es geht in Klasse ${roem(nr + 1)}.` };
      else if (z && zeile) was = { art: "", txt: `Platz ${zeile.pl} — bleibt in Klasse ${roem(nr)}.` };
      // Regeln für die Phase da, aber nicht für diese Klasse = letzte Klasse (Rundschreiben).
      else if (zeile && regelnVon(D.saison.id, aktuell.n)) was = { art: "", txt: `Platz ${zeile.pl}. Für diese Klasse hängen Auf- und Abstieg von den Anmeldungen ab.` };
      else if (zeile) was = { art: "", txt: `Platz ${zeile.pl}.` };
      const neuFehlt = !kommend.some(sp => sp.typ === "CC");
      status = { fertig, was, neuFehlt };
    }
  }
  return { team, ids, eigen, aktuell, frueher: liga.slice(0, -1).reverse(), kommend, gespielt, status };
}

// ---- Live (FuPa, data/live.json aus tools/fussball-live.mjs) ----
// Kasten nur, wenn das Live-Spiel zu diesem Reiter gehört, FuPa es als laufend oder beendet
// führt und die FLF noch kein Ergebnis hat — danach steht es normal bei den Ergebnissen.
// Höchstens 4 h nach Anstoß, falls die Action einmal hängen bleibt.
const LIVE_FENSTER = { vor: 15 * 60e3, nach: 180 * 60e3 };   // wie tools/fussball-live.mjs
// Endstand von FuPa bleibt stehen, bis die FLF ihr Ergebnis hat, höchstens 48 h (vom Nutzer, 23.10.2026:
// Seniors 3 um 20:00, um 23:00 war der Stand weg, die FLF noch leer).
const ENDE_FRIST = 48 * 3600e3;
function liveAnzeige(L, v, now) {
  if (!L || !v) return null;
  const sp = [...v.kommend, ...v.gespielt].find(s => s.id === L.flfId);
  if (!sp || (sp.gespielt && sp.hs != null)) return null;
  if (now > Date.parse(L.anstoss) + (L.section === "POST" ? ENDE_FRIST : 4 * 3600e3)) return null;
  if (L.section !== "LIVE" && L.section !== "POST") return null;
  // FuPa setzt ab Anpfiff von selbst „LIVE“, auch ohne Tickerer (19.10.2026, Seniors 2 gegen Titus:
  // kein Stand, kein Name). Dann bleibt der Spieltag-Kasten „Spiel läuft“ stehen.
  if (L.hs == null && L.as == null && !L.ticker && !(L.tore || []).length) return null;
  return { ...L, zeit: liveZeit(L, now), laeuft: L.section === "LIVE" };
}

// Minute aus dem letzten Abruf weitergezählt; über 45/90/105/120 hinaus „45+“ usw. (Nachspielzeit
// kennt nur der Tickerer, und das Weiterzählen soll nicht bei 97' stehen, wenn die Action hängt).
// Gesehen hat FuPa bisher „started“, „halftime“, „secondHalf“; für Verlängerung und
// Elfmeterschießen kennen wir die Namen noch nicht — darum nach Wortteilen statt genau.
function liveZeit(L, now) {
  if (L.section === "POST") return "Abpfiff";
  const p = String(L.period || "").toLowerCase();
  if (/penal|shoot/.test(p)) return "Elfmeterschießen";
  if (p.includes("halftime") || p.includes("break") || p.includes("pause")) return p === "halftime" ? "Halbzeit" : "Pause";
  if (L.minute == null) return "läuft";
  let m = L.minute;
  if (L.running && L.minuteAt) m += Math.max(0, Math.floor((now - Date.parse(L.minuteAt)) / 60e3));
  const verl = /overtime|extra/.test(p) || L.minute > 90;
  const deckel = p === "started" || p === "firsthalf" ? 45 : !verl ? 90 : L.minute <= 105 && !/second/.test(p) ? 105 : 120;
  const txt = m > deckel ? deckel + "+" : m + "'";
  return verl ? "Verlängerung " + txt : txt;
}

// Art des Tors aus FuPas `subtype`. Am 18.10.2026 in 11 Koeppchen-Spielen gesehen: goal_shoot
// (34×, normaler Schuss, kein Zusatz), goal_headed, penalty_foul, goal_scrounger, goal_free_kick,
// goal_own_goal, penalty_shootout, goal_distance_shoot. Nach Wortteilen, falls FuPa mehr kennt;
// Elfmeterschießen vor Elfmeter prüfen (beide enthalten „penalty“).
function torArt(art) {
  const a = String(art || "").toLowerCase();
  if (a.includes("own")) return "Eigentor";
  if (a.includes("shootout")) return "Elfmeterschießen";
  if (a.includes("penalty")) return "Elfmeter";
  if (a.includes("free")) return "Freistoß";
  if (a.includes("head")) return "Kopfball";
  if (a.includes("scrounger")) return "Abstauber";
  if (a.includes("distance")) return "Fernschuss";
  return "";
}

// Karten aus FuPas `subtype` (gesehen: card_red). Gelb-Rot vor Rot prüfen, der Name enthält beides.
// In 11 Spielen kam nur card_red vor — FuPa führt in `highlights` wohl nur Platzverweise.
function kartenArt(art) {
  const a = String(art || "").toLowerCase();
  if (a.includes("yellow") && a.includes("red")) return { zeichen: "🟨🟥", text: "Gelb-Rot" };
  if (a.includes("red")) return { zeichen: "🟥", text: "Rot" };
  if (a.includes("yellow")) return { zeichen: "🟨", text: "Gelb" };
  return { zeichen: "🃏", text: "Karte" };
}

// Tore, Karten und verschossene Elfmeter (vom Nutzer, 23.10.2026) in einer Liste, nach Minute (bei gleicher Minute Tor zuerst).
function ereignisListe(lv) {
  const tore = (lv.tore || []).map(t => ({ ...t, typ: "tor" }));
  const karten = (lv.karten || []).map(k => ({ ...k, typ: "karte" }));
  const fehl = (lv.fehl || []).map(k => ({ ...k, typ: "fehl" }));
  return [...tore, ...karten, ...fehl].sort((x, y) => x.min - y.min || x.plus - y.plus || (x.typ === "tor" ? -1 : 1));
}

// „Heute Spieltag“ (vom Nutzer gewünscht, für alle Reiter): das erste eigene Spiel heute (Tag in
// Luxemburg), solange es kein Ergebnis hat — längstens 3 h nach Anstoß. `begonnen` ab Anstoß.
const tagLux = ms => new Date(ms).toLocaleDateString("sv-SE", { timeZone: "Europe/Luxembourg" });
function spieltagHeute(v, now) {
  if (!v) return null;
  const sp = [...v.kommend, ...v.gespielt]
    .filter(s => tagLux(Date.parse(s.d)) === tagLux(now))
    .filter(s => !(s.gespielt && s.hs != null) && !istVorbei(s, now) && !s.abgesagt)
    .sort((a, b) => a.d.localeCompare(b.d))[0];
  // Uhrzeit offen: nie „Spiel läuft“, sonst stünde das ab Mitternacht da.
  return sp ? { sp, begonnen: !zeitOffen(sp) && now >= Date.parse(sp.d) } : null;
}

// Koeppi (Maskottchen, vom Verein angeregt, Plan vom Nutzer 22.10.2026): nur bei den Kinder-Reitern
// (U9, U11, U13, U15) und in „Unsere Woche“, nie bei den Seniors, nie im Live-Kasten.
// Nach der Altersklasse, nicht nach dem Namen: Kinder heißen seit neu m „MIN 1“, „SCO“ … (vom Verein).
const istKinder = v => ["U7", "U9", "U11", "U13", "U15"].includes(v?.team?.kat) || /^(U(7|9|11|13|15)|MIN|SCO|POU|PUP|BAM)\b/.test(v?.team?.reiter || "");
// Morgen ein eigenes Spiel? Dann am Vortag der Kasten „Morgen Spieltag!“ (vom Nutzer, Variante A).
function tagPlus(tag, n) { const [y, m, d] = tag.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
const tagNach = tag => tagPlus(tag, 1);
const tageZwischen = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
// Ein Spiel ohne Ergebnis gilt bis 3 h nach Anpfiff als „kommt noch“, mit offener Uhrzeit (00:00) bis
// Ende des Spieltags (Luxemburger Zeit).
const istVorbei = (sp, now) => zeitOffen(sp) ? tagLux(now) > tagLux(Date.parse(sp.d)) : now > Date.parse(sp.d) + 3 * 3600e3;
function spieltagMorgen(v, now) {
  if (!v) return null;
  const morgen = tagNach(tagLux(now));
  const sp = v.kommend.filter(s => tagLux(Date.parse(s.d)) === morgen && !s.abgesagt).sort((a, b) => a.d.localeCompare(b.d))[0];
  return sp ? { sp } : null;
}
// Streifen über den Ergebnissen nach jedem Spiel, egal wie es ausging (vom Verein, 22.10.2026: keine
// Ergebnisse hervorheben, gelobt wird das Spielen, nicht der Sieg). Höchstens 7 Tage, und nicht mehr,
// sobald das nächste Spiel ansteht (Vortag/Spieltag zeigen ihre eigenen Kästen).
function nachDemSpiel(v, now) {
  if (!istKinder(v) || spieltagHeute(v, now) || spieltagMorgen(v, now)) return null;
  const sp = v.gespielt.find(s => Date.parse(s.d) <= now && !s.abgesagt);
  if (!sp || now - Date.parse(sp.d) > 7 * 864e5) return null;
  // Reihum (vom Nutzer): jede Woche der nächste Spruch, und jeder Reiter fängt woanders an.
  // Fest je Spiel, damit er nicht bei jedem Neuaufbau wechselt.
  // Seit 25.10.2026 nach der Woche des Spiels statt nach der Zahl der Spiele (vom Nutzer): sonst hoben sich der
  // Versatz und ein Spiel mehr (Pokal) auf, und MIN 1 und MIN 2 hatten denselben Spruch. 8 Sprüche, 7 Teams:
  // am selben Wochenende nie zwei gleiche, jede Woche der nächste.
  const nr = Math.floor((Date.parse(tagLux(Date.parse(sp.d)) + "T12:00:00Z") / 864e5 + 3) / 7);
  const fest = ["MIN 1", "MIN 2", "SCO", "POU 1", "POU 2", "PUP 1", "PUP 2", "BAM 1", "BAM 2"].indexOf(v.team.reiter);   // Namen vom Verein, Reihenfolge wie vorher (U13 1, U13 2, U15 …)
  const versatz = fest >= 0 ? fest : [...v.team.reiter].reduce((x, c) => x + c.charCodeAt(0), 0);
  return { sp, spruch: SPRUECHE[(nr + versatz) % SPRUECHE.length] };
}
// „Letztes Spiel“ oben (vom Nutzer, 30.10.2026, Fassung 30.10. neu r): bis zum Vortag des nächsten Spiels, höchstens 7 Tage.
// Seniors 1–3: Ergebnis groß, dazu Klasse und Platz (kein „Sieg/Niederlage“, sieht man am Ergebnis). Jugend: Koeppi und Spruch
// vorne, Ergebnis klein wie in der Liste (Vereinswunsch), U7/U9/U11 „gespielt“, Bambinis ohne Gegner-Zeile. Das Spiel steht
// außerdem normal unten in den Ergebnissen (der grüne Koeppi-Streifen dort ist dafür weg).
// „Am Ga (Wormeldange, synth.)“ → „Wormeldange“, ohne Klammer der Platzname.
const ortKurz = o => (/\(([^,)]+)/.exec(o) || [])[1]?.trim() || o;
function letztesHtml(v, now) {
  if (spieltagHeute(v, now) || spieltagMorgen(v, now)) return "";
  const datum = sp => esc(wann(sp.d, false).split(" · ")[0]);
  if (v.team.kat === "Seniors") {
    const sp = v.gespielt.find(s => Date.parse(s.d) <= now && !s.abgesagt && !s.coach && s.gespielt && s.hs != null);
    if (!sp || now - Date.parse(sp.d) > 7 * 864e5) return "";
    const liga = v.aktuell && v.aktuell.spiele.some(x => x.id === sp.id);
    const zeile = liga && (v.aktuell.tabelle || []).find(r => v.eigen.has(r.id));
    const unten = [liga ? esc(v.aktuell.n) : art(sp) ? esc(art(sp)) : "", zeile ? `jetzt <b>${zeile.pl}. Platz</b>` : ""].filter(Boolean).join(" · ");
    return `<section class="card heute letztes"><div class="chead"><h2>Letztes Spiel</h2><span class="pill">Endstand</span></div><div class="cbody">
      <div class="wann klein">${datum(sp)}${liga && sp.tag ? ` · Spieltag ${sp.tag}` : ""}</div>
      <div class="m" style="border:0"><div class="t h${v.ids.has(sp.h.id) ? " wir" : ""}">${umbruch(anzeige(sp.h.n))}</div>
      <div class="gross">${sp.hs}:${sp.as}</div><div class="t${v.ids.has(sp.a.id) ? " wir" : ""}">${umbruch(anzeige(sp.a.n))}</div></div>
      ${unten ? `<div class="zusatz">${unten}</div>` : ""}${MOTTO}</div></section>`;
  }
  const nach = nachDemSpiel(v, now);
  if (!nach) return "";
  const sp = nach.sp, naechst = v.kommend[0];
  const spiel = sp.bam ? `<div class="zusatz">Mini-Spieltag${sp.ort ? " in " + esc(ortKurz(sp.ort)) : ""} mit ${esc(sp.bam.mit.map(anzeige).join(", "))}</div>`
    : spielZeile(sp, v.ids, "").replace('<div class="m">', '<div class="m" style="border:0">');
  return `<section class="card heute letztes"><div class="chead"><h2>Letzter Spieltag</h2></div><div class="cbody">
    <div class="wann klein">${datum(sp)}</div>
    <div class="kzeile">${koeppiBild("ball-faust")}<span>Super gemacht, ${esc(v.team.reiter)}! 💪<br><span class="spruch">${esc(nach.spruch)}</span></span></div>
    ${spiel}${naechst ? `<div class="zusatz">${sp.bam ? "Nächster Mini-Spieltag" : "Nächstes Spiel"}: ${esc(wann(naechst))}${esc(naechst.bam ? (naechst.ort ? " in " + ortKurz(naechst.ort) : "") : " gegen " + anzeige(v.ids.has(naechst.h.id) ? naechst.a.n : naechst.h.n))}</div>` : ""}${MOTTO}</div></section>`;
}
// Sprüche vom Verein (22.10.2026).
const SPRUECHE = ["Talent bringt dich weit, harte Arbeit bringt dich weiter!", "Werde jeden Tag ein kleines Stück besser!",
  "Bleib hungrig, bleib fokussiert, bleib dran!", "Teamwork makes the dream work!", "Der nächste Schritt beginnt heute!",
  // dazu vom Nutzer ausgesucht (22.10.2026):
  "Allein bist du schnell, zusammen kommt ihr weit!", "Together everyone achieves more – TEAM!",
  "Wer kämpft, kann verlieren. Wer nicht kämpft, hat schon verloren."];

// Countdown in den letzten 15 min vor Anpfiff (vom Nutzer, 19.10.2026, für alle Reiter): Minuten,
// aufgerundet; null außerhalb und bei „Uhrzeit noch offen“ (00:00 bei der FLF).
const COUNTDOWN_MS = 15 * 60e3;
function minutenBisAnpfiff(sp, now) {
  const a = Date.parse(sp.d), rest = a - now;
  if (!(rest > 0) || rest > COUNTDOWN_MS) return null;
  const zeit = new Date(a).toLocaleTimeString("de-DE", { timeZone: "Europe/Luxembourg", hour: "2-digit", minute: "2-digit" });
  return zeit === "00:00" ? null : Math.ceil(rest / 60e3);
}
const countdownText = m => `Anpfiff in ${m} ${m === 1 ? "Minute" : "Minuten"}`;

// Liegt bei diesem Reiter gerade ein Spiel im Live-Fenster? Dann fragt die App jede Minute nach.
// Stand vom Cloudflare-Worker (tools/cloudflare-worker.js, bis ~2 min alt: 60 s Abfrage + 60 s Merken im Worker) über den von GitHub legen
// (data/live.json, bis zu 7 min alt). Vom Worker kommt nur der Stand; welches Spiel, Anstoß und
// Mannschaftsnamen bleiben aus live.json. Passt der Slug nicht (anderes Spiel), gilt GitHub.
const WORKER_FELDER = ["hs", "as", "section", "period", "running", "minute", "minuteAt", "tore", "karten", "fehl", "ticker"];
// Passt W zu L? Über den FuPa-Slug, oder — wenn der GitHub-Lauf noch keinen geliefert hat — über
// das FLF-Spiel, für das die App den Worker per Anstoßzeit gefragt hat (`W.fuer`).
function mitWorker(L, W) {
  if (!L || !W) return L;
  if (L.slug ? W.slug !== L.slug : W.fuer !== L.flfId) return L;
  const neu = { ...L };
  for (const k of WORKER_FELDER) if (k in W) neu[k] = W[k];
  if (!L.slug && W.slug) { neu.slug = W.slug; neu.url = "https://www.fupa.net/match/" + W.slug; }
  return neu;
}

// Live gibt es nur bei den Seniors (FuPa führt keine Jugend). Seniors 1: der Worker sucht das Spiel
// selbst (per Anstoßzeit). Seniors 2/3 (seit 19.10.2026): nur mit FuPa-Slug, den der Abruf vorab
// holt (`D.fupa`, FLF-Spiel-ID → Slug) — die Suche im Worker kennt nur die Seniors 1.
const LIVE_REITER = "Seniors 1", LIVE_RESERVE = ["Seniors 2", "Seniors 3"];
function hatLive(v) {
  return !!v && (v.team.reiter === LIVE_REITER || LIVE_RESERVE.includes(v.team.reiter));
}

// Das Spiel dieses Reiters, das gerade im Live-Fenster liegt, oder null.
// Nach dem Fenster bleibt ein Spiel ohne FLF-Ergebnis bis ENDE_FRIST dabei, wenn `spaet(sp)` ja sagt
// (die App: Endstand schon bekannt, oder in dieser Sitzung noch nicht nachgefragt).
function liveSpiel(v, now, fupa = {}, spaet = null) {
  if (!hatLive(v)) return null;
  const sp = [...v.kommend, ...v.gespielt].find(sp => {
    if (sp.coach) return false;   // Trainer-Spiele: kein Ticker
    const a = Date.parse(sp.d);
    if (now >= a - LIVE_FENSTER.vor && now <= a + LIVE_FENSTER.nach) return true;
    return !!spaet && sp.hs == null && now > a + LIVE_FENSTER.nach && now <= a + ENDE_FRIST && spaet(sp);
  }) || null;
  if (!sp || v.team.reiter === LIVE_REITER) return sp;
  const slug = fupa[sp.id];
  if (!slug) return null;
  // Heim/Gast wie bei FuPa (der Stand kommt von dort). Gesehen: Beggen–Koeppchen II am 23.10.2026
  // führt die FLF mit Beggen als Heim, FuPa mit Koeppchen. Der Slug beginnt mit der Heimmannschaft.
  const fupaWirHeim = slug.startsWith("fc-koeppchen-"), flfWirHeim = v.ids.has(sp.h.id);
  return fupaWirHeim === flfWirHeim ? { ...sp, slug } : { ...sp, slug, h: sp.a, a: sp.h };
}

// Grundlage für den Kasten: live.json, wenn sie dieses Spiel meint — sonst ein leeres Gerüst aus
// dem FLF-Spielplan, das der Worker füllt. So braucht der Kasten den GitHub-Lauf nicht.
function liveBasis(L, sp) {
  if (!sp) return L;
  if (L && L.flfId === sp.id) return L;
  // Länderspiele bringen ihren FuPa-Slug mit (tools/fussball.mjs), dort fragt die App den Worker direkt.
  return { flfId: sp.id, slug: sp.slug || null, url: sp.slug ? "https://www.fupa.net/match/" + sp.slug : null,
           anstoss: sp.d, h: sp.h.n, a: sp.a.n, section: "", tore: [], karten: [] };
}

function imLiveFenster(v, now) {
  return [...v.kommend, ...v.gespielt].some(sp => {
    if (sp.coach) return false;
    const a = Date.parse(sp.d);
    return now >= a - LIVE_FENSTER.vor && now <= a + LIVE_FENSTER.nach;
  });
}

// ---- BGL Ligue und Nationalteam (eigene Reiter, vom Nutzer 19.10.2026) ----
// Zusätzliche Reiter hinter den Mannschaften; `id` ist Text, die Mannschaften haben Zahlen.
function extraReiter(D) {
  return [D.bgl && { id: "bgl", reiter: "BGL" }, D.nati && { id: "nati", reiter: "Roude Léiw", bild: "flf" },
    // Jugendkommission (vom Nutzer, 25.10.2026): immer der letzte, mit Foto, Video und allen Kalender-Abos.
    { id: "jk", reiter: "Jugend", bild: "bilder/jk-logo-klein.png", klasse: "jk" }].filter(Boolean);
}

// Reiter-Raster (vom Nutzer, 25.10.2026): Handy 4, ab 600 px 6 je Reihe. Volle Reihen normal breit, die
// letzte Reihe teilt sich die ganze Breite gleichmäßig — so bleibt nie eine Lücke, egal wie viele Mannschaften
// es gibt. Raster mit 60 Spalten (geht in 1–6 auf); Rückgabe je Knopf [Handy, Computer] in Spalten.
function reiterBreiten(n) {
  const fuer = sp => { const rest = n % sp, voll = n - rest; return i => 60 / (i < voll ? sp : rest); };
  const h = fuer(4), c = fuer(6);
  return Array.from({ length: n }, (_, i) => [h(i), c(i)]);
}

// BGL: letzter Spieltag = der höchste, an dem schon gespielt wurde (auch angefangen — die offenen
// Spiele stehen dann mit Uhrzeit drin), dahinter die zwei nächsten (vom Nutzer: beide nächsten).
// Ein einzelnes verlegtes Spiel bleibt in seinem Spieltag, verschiebt also nichts.
function bglSicht(bgl, now) {
  const tage = nachSpieltag(bgl.spiele);
  const grenze = now - 3 * 3600e3;
  let i = -1;
  tage.forEach(([, sp], k) => { if (sp.some(s => s.gespielt || Date.parse(s.d) < grenze)) i = k; });
  return { letzter: i >= 0 ? tage[i] : null, naechste: tage.slice(i + 1, i + 3) };
}

// Die FLF rechnet ihre Tabelle erst nach der Freigabe der Ergebnisse (19.10.2026: BGL-Tabelle
// nach 8 Spielen, gespielt waren 10). Liegt sie zurück, rechnen wir selbst: Punkte, Tordifferenz,
// Tore. Bei Punktgleichheit kann die FLF anders sortieren — das steht dann unter der Tabelle.
function bglTabelle(bgl) {
  const z = new Map();
  // Punktabzüge (Swift Hesperange 2026-27: −12) stehen nur in der FLF-Tabelle. Abzug = FLF-Punkte
  // minus das, was die ersten `sp` Spiele der Mannschaft ergeben — so weit hat die FLF gezählt.
  const flf = new Map((bgl.tabelle || []).map(r => [r.id, r]));
  for (const sp of [...bgl.spiele].sort((a, b) => a.d.localeCompare(b.d))) {
    if (!sp.gespielt || sp.hs == null || sp.as == null) continue;
    for (const [t, f, g] of [[sp.h, sp.hs, sp.as], [sp.a, sp.as, sp.hs]]) {
      const r = z.get(t.id) || { id: t.id, n: t.n, sp: 0, s: 0, u: 0, nl: 0, t: 0, g: 0, pkt: 0, bisFlf: 0 };
      r.sp++; r.t += f; r.g += g;
      const p = f > g ? 3 : f === g ? 1 : 0;
      if (p === 3) r.s++; else if (p === 1) r.u++; else r.nl++;
      r.pkt += p;
      if (r.sp <= (flf.get(t.id)?.sp ?? 0)) r.bisFlf += p;
      z.set(t.id, r);
    }
  }
  for (const r of z.values()) {
    const f = flf.get(r.id);
    r.abzug = f ? Math.min(0, f.pkt - r.bisFlf) : 0;
    r.pkt += r.abzug;
    delete r.bisFlf;
  }
  const flfSp = Math.max(0, ...(bgl.tabelle || []).map(r => r.sp)), unsSp = Math.max(0, ...[...z.values()].map(r => r.sp));
  if (bgl.tabelle?.length && flfSp >= unsSp) return { tabelle: bgl.tabelle, selbst: false };
  const tab = [...z.values()].sort((a, b) => b.pkt - a.pkt || (b.t - b.g) - (a.t - a.g) || b.t - a.t || a.n.localeCompare(b.n));
  tab.forEach((r, i) => r.pl = i + 1);
  return { tabelle: tab, selbst: true, flfSp };
}

// Länderspiel im Live-Fenster (wie bei den Seniors 1), nur mit FuPa-Slug.
// Nach dem Fenster wie bei den Seniors (`spaet`), bis das Ergebnis in den Daten steht, höchstens ENDE_FRIST.
function natiLiveSpiel(v, now, spaet = null) {
  return [...v.kommend, ...v.gespielt].find(sp => {
    if (!sp.slug) return false;
    const a = Date.parse(sp.d);
    if (now >= a - LIVE_FENSTER.vor && now <= a + LIVE_FENSTER.nach) return true;
    return !!spaet && sp.hs == null && now > a + LIVE_FENSTER.nach && now <= a + ENDE_FRIST && spaet(sp);
  }) || null;
}

// Nationalteam: kommend/gespielt wie bei einer Mannschaft (3-h-Grenze).
function natiSicht(nati, now) {
  const grenze = now - 3 * 3600e3;
  const kommend = nati.spiele.filter(sp => !sp.gespielt && Date.parse(sp.d) >= grenze);
  const gespielt = nati.spiele.filter(sp => sp.gespielt || Date.parse(sp.d) < grenze).reverse();
  return { kommend, gespielt, gruppe: nati.gruppe };
}

// Spieltage einer Klasse, für „Alle Spiele“.
function nachSpieltag(spiele) {
  const m = new Map();
  for (const sp of spiele) {
    const k = sp.tag ?? 0;
    if (!m.has(k)) m.set(k, []);

let WLANG = (() => { const l = (navigator.language || "de").slice(0, 2); return W_TEXT[l] ? l : "de"; })();
function willkommen() {
  document.getElementById("willkommen")?.remove();
  if (!BEGRUESSUNG || MITT_OFFEN || COACH_OFFEN) return false;
  try { if (localStorage.getItem(WILLKOMMEN)) return false; } catch (e) { return false; }
  const main = document.querySelector("main");
  if (!main) return false;
  const t = W_TEXT[WLANG], d = document.createElement("section");
  d.className = "card willkommen"; d.id = "willkommen";
  d.innerHTML = `<div class="cbody"><div class="wsprachen">${Object.entries(W_TEXT).map(([k, x]) =>
      `<button data-wlang="${k}" class="${k === WLANG ? "an" : ""}">${x.flag} ${k.toUpperCase()}</button>`).join("")}</div>
    <div class="kzeile">${koeppiBild("fahne")}<div class="mhtitel">${esc(t.titel)}</div></div>
    <p>${esc(t.a)}</p><p>${esc(t.b)}</p><p><b>${esc(t.so)}</b></p><ul>${t.l.map(x => `<li>${x}</li>`).join("")}</ul>
    <p>${esc(t.ende)} <span class="motto">#mirvunderkoeppchen</span></p><button class="knopf" data-wlos="1">${esc(t.los)}</button></div>`;
  main.insertBefore(d, main.firstChild);
  return true;
}
document.addEventListener("click", e => {
  const l = e.target.closest("[data-wlang]");
  if (l) { WLANG = l.dataset.wlang; willkommen(); return; }
  if (e.target.closest("[data-wlos]")) { try { localStorage.setItem(WILLKOMMEN, "1"); } catch (err) {} render(); window.scrollTo(0, 0); }
});
// Einmaliger Hinweis „Neu: Mitteilungen“ (vom Nutzer, 30.10.2026), sobald sie für alle freigeschaltet sind; ✕ merkt es sich je Gerät.
const MHINWEIS = KEY + "_mhinweis";
function mittHinweis() {
  if (!MITT_FUER_ALLE || MITT_OFFEN || COACH_OFFEN) return;
  try { if (localStorage.getItem(MHINWEIS)) return; } catch (e) { return; }
  const main = document.querySelector("main");
  if (!main || document.getElementById("mhinweis")) return;
  const d = document.createElement("section");
  d.className = "card mhinweis"; d.id = "mhinweis";
  d.innerHTML = `<button class="mhweg" data-mhweg="1" aria-label="Schließen">✕</button><div class="cbody">
    <div class="mhtitel">🔔 Neu: Mitteilungen</div>
    <div>Tipp oben rechts auf ⚙️ und wähl deine Mannschaften – z. B. „Morgen Spiel“, „Spieltag“ oder „Tabelle“.</div>
    <div style="margin-top:6px">Wir schalten die Mitteilungen <b>nach und nach</b> frei. Sind gerade alle Plätze vergeben, probier es in ein paar Tagen noch einmal.</div>
    <div class="muted" style="font-size:13px;margin-top:6px">${istApp() ? "Funktioniert nur in der installierten App."
      : `Funktioniert nur in der installierten App – <a href="#" data-mhinstall="1">so installierst du sie</a>.`}</div></div>`;
  main.insertBefore(d, main.firstChild);
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-mhweg]")) { try { localStorage.setItem(MHINWEIS, "1"); } catch (err) {} document.getElementById("mhinweis")?.remove(); return; }
  if (e.target.closest("[data-mhinstall]")) { e.preventDefault(); MITT_OFFEN = true; COACH_OFFEN = false; MITT_STAND = ""; render(); window.scrollTo(0, 0); }
});
function renderInnen() {
  const main = document.getElementById("main");
  if (!D) return;
  UMSCHALT = null;   // setzt heuteHtml, wenn ein Spieltag-Kasten steht
  const { tabs } = aufteilen(D);
  // Beim allerersten Öffnen „Unsere Woche“ (vom Nutzer, 20.10.2026), danach der zuletzt gewählte
  // Reiter (persist beim Umschalten). Gibt es den gemerkten Reiter nicht mehr, auch die Woche.
  const extra = extraReiter(D);
  if (!tabs.some(t => t.id === ST.team) && !extra.some(t => t.id === ST.team)) ST.team = "woche";
  const wTage = wocheTage(Date.now()), wAlle = wocheSpiele(D, wTage, Date.now());
  const heuteN = wAlle.filter(sp => tagLux(Date.parse(sp.d)) === tagLux(Date.now())).length;
  const liveN = liveZahl(Date.now());
  const wZahl = liveN ? `🔴 ${liveN} ${liveN === 1 ? "Spiel" : "Spiele"} gerade LIVE` : heuteN ? `heute ${heuteN} ${heuteN === 1 ? "Spiel" : "Spiele"}` : `${wAlle.length} ${wAlle.length === 1 ? "Spiel" : "Spiele"}`;
  const alleReiter = [...tabs, ...extra], breit = reiterBreiten(alleReiter.length);
  document.getElementById("seg").innerHTML = `<button data-t="woche" class="woche${ST.team === "woche" ? " on" : ""}"><img alt="" src="${LOGO}">Unsere Woche · ${wZahl}<img alt="" src="${LOGO}"></button>` + alleReiter.map((t, i) =>
    `<button data-t="${t.id}" style="--sp:${breit[i][0]};--spd:${breit[i][1]}" class="${t.id === ST.team ? "on" : ""}">${t.bild ? `<img alt="${esc(t.reiter)}" src="${t.bild === "flf" ? FLF_LOGO : t.bild}"${t.klasse ? ` class="${t.klasse}"` : ""}>` : esc(t.reiter || t.n)}</button>`).join("");
  if (ST.team == null) { main.innerHTML = `<div class="note">Keine Spiele gefunden.</div>`; return; }
  // Zahnrad = eigener Reiter (vom Nutzer, 21.10.2026). Wird nicht bei jedem Takt neu gebaut, damit
  // Haken und Knöpfe stehen bleiben; der gewählte Mannschafts-Reiter bleibt gemerkt.
  document.getElementById("zahnrad").classList.toggle("on", MITT_OFFEN);
  document.getElementById("coachknopf").classList.toggle("on", COACH_OFFEN);
  if (COACH_OFFEN && coachDa()) {
    document.querySelectorAll("#seg button.on").forEach(b => b.classList.remove("on"));
    document.getElementById("sub").textContent = "Coach";
    if (!document.getElementById("coach")) { main.innerHTML = `<div id="coach" class="mitt"></div>` + fuss(); coachHtml(); }
    return;
  }
  if (MITT_OFFEN) {
    document.querySelectorAll("#seg button.on").forEach(b => b.classList.remove("on"));
    document.getElementById("sub").textContent = "Mitteilungen";
    if (!document.getElementById("mitt")) { main.innerHTML = `<div id="mitt" class="mitt"></div>` + fuss(); mittHtml(); }
    return;
  }

  const now = Date.now();
  if (ST.team === "woche") {
    LIVE_SP = null; LIVE_POLL = false;
    document.getElementById("sub").textContent = "Unsere Woche · " + D.saison.n.replace("Saison ", "");
    main.innerHTML = wocheHtml(wTage, wAlle, now) + fuss();
    return;
  }
  if (ST.team === "jk") {
    LIVE_SP = null; LIVE_POLL = false;
    document.getElementById("sub").textContent = "Jugendkommission";
    main.innerHTML = jkHtml(tabs) + fuss();
    return;
  }
  if (ST.team === "bgl" || ST.team === "nati") {
    LIVE_SP = null; LIVE_POLL = false;   // natiHtml setzt beide, wenn ein Länderspiel läuft
    main.innerHTML = (ST.team === "bgl" ? bglHtml(now) : natiHtml(now)) + fuss();
    return;
  }
  const v = sicht(D, ST.team, now);
  // Mannschaftsnummer aus dem FLF-Namen („… I“/„… II“) dazu, damit man auch ohne Reiter weiß, welches Team
  // es ist: „U13 Minimes 1“, „Seniors Réserves 2“ (vom Nutzer, 26.10.2026). Ohne Nummer bleibt es wie es war.
  const nr = { I: 1, II: 2, III: 3, IV: 4 }[(/ (I{1,3}|IV)$/.exec(v.team.n || "") || [])[1]];
  const ids = v.ids, alter = (v.team.alter || "") + (v.team.alter && nr ? " " + nr : "");
  document.getElementById("sub").textContent = (alter ? alter + " · " : "") + D.saison.n.replace("Saison ", "");
  const art = sp => (sp.abgesagt ? "ABGESAGT · " : "") + artText(sp);
  let h = "";

  LIVE_SP = FUPA_API ? liveSpiel(v, now, D.fupa || {}, spaet) : null;
  const lv = FUPA_API ? liveAnzeige(mitWorker(liveBasis(L, LIVE_SP), wFrisch(LIVE_SP)), v, now) : null;
  LIVE_POLL = FUPA_API && (!!lv?.laeuft || imLiveFenster(v, now));   // nach Abpfiff (bis zum FLF-Ergebnis) nicht mehr jede Minute
  // Spieltag-Kasten, solange (noch) kein LIVE-Kasten da ist.
  const heute = !lv && spieltagHeute(v, now);
  const kinder = istKinder(v);
  // Ohne FuPa-Schnittstelle: am Spieltag das FuPa-Widget unter dem Kasten (Seniors 1–3, nicht bei Trainer-Spielen).
  const fw = !FUPA_API && heute && !heute.sp.coach && FUPA_WIDGET[v.team.reiter];
  if (heute) h += heuteHtml(heute, v.ids, { live: FUPA_API && !heute.sp.coach && (v.team.reiter === LIVE_REITER || !!(D.fupa || {})[heute.sp.id]), widget: !!fw, pill: sp => sp.coach ? sp.coach.art : sp.typ === "CUP" ? "Pokal" : "",
    ohneLive: "Das Ergebnis erscheint, sobald es eingetragen ist.", koeppi: kinder, motto: true,
    fupaUrl: (D.fupa || {})[heute.sp.id] ? "https://www.fupa.net/match/" + D.fupa[heute.sp.id]
      : L && L.flfId === heute.sp.id && L.url ? L.url : "https://www.fupa.net/club/fc-koeppchen" });
  if (fw) h += fupaWidgetHtml(fw, v.team.reiter, heute.sp.d);
  const morgen = kinder && !heute && !lv && spieltagMorgen(v, now);
  if (morgen) h += morgenHtml(morgen, v.ids, sp => sp.coach ? sp.coach.art : sp.typ === "CUP" ? "Pokal" : "");
  h += letztesHtml(v, now);
  if (lv) h += liveHtml(lv, n => anzeige(n).startsWith("Koeppchen"), "offiziell zählt die FLF");

  if (v.status && v.status.was) {
    // Kinder: wartet die neue Klasse noch, steht der ruhige Koeppi rechts im Kasten.
    const ruhig = kinder && v.status.neuFehlt;
    h += `<div class="note ${v.status.was.art}${ruhig ? " mitk" : ""}">${ruhig ? "<div>" : ""}<b>${esc(v.aktuell.n)} ist beendet.</b> ${esc(v.status.was.txt)}` +
      (v.status.neuFehlt ? `<br><span class="muted">Die neue Klasse ist bei der FLF noch nicht eingetragen. Sobald das erste Spiel drinsteht, erscheint sie hier von selbst.</span>` : "") + `${ruhig ? "</div>" + koeppiBild("ruhig") : ""}</div>`;
  }

  h += `<section class="card"><div class="chead"><h2>Nächste Spiele</h2></div><div class="cbody">`;
  if (!v.kommend.length) h += kinder ? koeppiZeile("ruhig", "Noch keine Termine eingetragen.", "links") : `<div class="muted">Noch keine Termine eingetragen.</div>`;
  // Höchstens fünf — bei den Seniors stünde sonst die halbe Saison hier.
  const ZEIG = 5;
  v.kommend.slice(0, ZEIG).forEach((sp, i) => {
    const pokal = art(sp) ? `<span class="pill">${art(sp)}</span>` : "";
    if (i === 0) {
      h += `<div class="next"><div class="when">${coachZeichen(sp)}${esc(wann(sp))} <span class="muted" style="font-family:Barlow;font-size:14px;letter-spacing:0">${bisDahin(sp.d, now)}</span></div>
        ${spielZeile(sp, ids, `${sp.ort ? "📍 " + esc(sp.ort) : ""}${pokal}<br>${esc(coachZusatz(sp) || sp.klasse)}`)}</div>`;
    } else h += spielZeile(sp, ids, `${coachZeichen(sp)}${esc(wann(sp))}${sp.ort ? " · 📍 " + esc(sp.ort) : ""}${pokal}${sp.coach && coachZusatz(sp) ? "<br>" + esc(coachZusatz(sp)) : ""}`);
  });
  if (v.kommend.length > ZEIG)
    h += `<div class="muted" style="text-align:center;font-size:12.5px;margin-top:8px">+ ${v.kommend.length - ZEIG} weitere unter „Alle Spiele der Klasse“</div>`;
  if (v.team.datei) {
    // Abo statt Export: die Action schreibt kalender/<reiter>.ics bei jedem Lauf neu, das iPhone
    // holt sie selbst ab — verschobene Spiele wandern mit. webcal:// öffnet die Kalender-App.
    // Kinder mit zwei Mannschaften: ein gemeinsamer Kalender (vom Nutzer, 23.10.2026), z. B. „Minimes U13“.
    h += kalKnopf(v.team.gruppe || { datei: v.team.datei, name: v.team.reiter });
  }
  h += `</div></section>`;

  if (v.aktuell && !v.aktuell.ergebnisse && !v.aktuell.tabelle) {
    h += `<div class="note">In der ${esc(v.team.kat)} veröffentlicht die FLF keine Ergebnisse und keine Tabelle — hier stehen darum nur die Termine.${v.team.kat === "U7" ? ` Die Mini-Spieltage stehen nicht im Extranet, sondern als PDF auf <a href="https://www.flf.lu/generaux-92804v4" target="_blank" rel="noopener">flf.lu</a>. Anstoß meist 10:30 (sauf changement), die genaue Uhrzeit kommt mit dem Wochenprogramm.` : ""}</div>`;
  } else if (v.aktuell) {
    h += `<section class="card"><div class="chead"><h2>Tabelle</h2><div class="hint">${esc(v.aktuell.n)}</div></div>
      <div class="cbody">${tabelleHtml(v.aktuell, v.eigen)}</div></section>`;
  }

  h += `<section class="card"><div class="chead"><h2>${v.aktuell && !v.aktuell.ergebnisse ? "Bisherige Spiele" : "Unsere Ergebnisse"}</h2></div><div class="cbody">`;
  if (!v.gespielt.length) h += `<div class="muted">Noch nichts gespielt.</div>`;
  const ergZeile = sp => {
    const pokal = art(sp) ? " · " + art(sp) : "";
    const fehlt = !sp.gespielt && sp.erg !== false ? " · Ergebnis noch nicht eingetragen" : "";
    return spielZeile(sp, ids, `${coachZeichen(sp)}${esc(wann(sp.d, false))}${pokal}${sp.forfait ? (Date.parse(sp.d) > now ? " · Forfait, im Voraus gewertet" : " · Forfait") : ""}${sp.bem === "Arrêté" ? " · abgebrochen, gewertet" : ""}${fehlt}`);
  };
  // Solange Koeppi lobt, steht das Spiel mit im Kasten (vom Nutzer, 25.10.2026) — gleich dargestellt wie in der
  // Liste (Wunsch des Vereins: Ergebnis nicht hervorheben), danach wieder normal unten in der Liste.

  for (const sp of v.gespielt) h += ergZeile(sp);
  h += `</div></section>`;

  if (v.aktuell) {
    h += `<details class="card"><summary><h2>Alle Spiele der Klasse</h2><span class="hint">${v.aktuell.spiele.length} Spiele</span></summary>
      <div class="cbody">${alleSpieleHtml(v.aktuell, ids)}</div></details>`;
  }
  for (const k of v.frueher) {
    h += `<details class="card"><summary><h2>Früher: ${esc(k.n.replace(alter, "").trim() || k.n)}</h2></summary>
      <div class="cbody">${tabelleHtml(k, v.eigen)}<div style="margin-top:10px">${alleSpieleHtml(k, ids)}</div></div></details>`;
  }

  main.innerHTML = h + fuss();
}

function kalKnopf(kal, ohneHilfe) {
  const url = KALENDER + kal.datei;
  return `<a class="kal" href="${esc(url.replace(/^https:/, "webcal:"))}">📅 ${esc(kal.name)} im Kalender abonnieren</a>` + (ohneHilfe ? "" :
    `<details class="kalhilfe"><summary>Klappt nicht?</summary>
        Einstellungen → Kalender → Accounts → Account hinzufügen → Andere → <b>Kalenderabo hinzufügen</b>, dann diese Adresse:
        <code>${esc(url)}</code><button class="kopie" data-copy="${esc(url)}">Adresse kopieren</button>
      </details>`);
}

// Alle Kalender, je einmal (Kinder als Altersklasse), in Reiter-Reihenfolge.
function alleKalender(tabs) {
  const seen = new Set();
  return tabs.map(t => t.datei && (t.gruppe || { datei: t.datei, name: t.reiter })).filter(k => k && !seen.has(k.datei) && seen.add(k.datei));
}

// Reiter Jugendkommission (vom Nutzer, 25.10.2026): Logo, Foto, Video, alle Kalender-Abos.

  return `<section class="card"><div class="cbody" style="text-align:center">
      <img src="bilder/jk-logo.png" alt="Jugendkommissioun FC Koeppchen" style="width:min(260px,70%);height:auto">
    </div></section>
    <section class="card"><div class="chead"><h2>Eis Jugendkommissioun</h2></div><div class="cbody">

      <div class="jkvideo"><iframe src="https://www.youtube-nocookie.com/embed/${JK_VIDEO}?playsinline=1&rel=0" title="Video FC Koeppchen"
        loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>

      ${kal.map(k => kalKnopf(k, true)).join("")}
      <details class="kalhilfe"><summary>Klappt nicht?</summary>
        Einstellungen → Kalender → Accounts → Account hinzufügen → Andere → <b>Kalenderabo hinzufügen</b>, dann eine dieser Adressen:
        ${kal.map(k => `<div style="margin-top:6px"><b>${esc(k.name)}</b><code>${esc(KALENDER + k.datei)}</code><button class="kopie" data-copy="${esc(KALENDER + k.datei)}">Adresse kopieren</button></div>`).join("")}
      </details>
    </div></section>`;

function fuss() {
  const stand = new Date(D.stand).toLocaleString("de-DE", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
  const quelle = ST.team === "nati" ? `<a href="https://www.fupa.net/team/luxemburg-m1" target="_blank" rel="noopener">FuPa</a>`
    : `<a href="https://extranet.flf.lu/match" target="_blank" rel="noopener">extranet.flf.lu</a>`;
  return `<footer>Daten von ${quelle}, zuletzt geändert ${esc(stand)}<br>
    Aktualisiert jeden Tag um 7:00, 12:00 und 23:30 Uhr, Mo–Fr zusätzlich um 22:15 Uhr, Sa/So von 8 bis 22 Uhr alle 15 Minuten.
    <br><button class="teilen" id="teilen">↗︎ App teilen</button>
    <div class="von" id="von">Gemacht von Laurent R. für den FC Koeppchen <img alt="" src="${LOGO}"></div>${eigenesGeraet() ? `<div style="font-size:11px">Dieses Gerät zählt nicht in der Statistik mit.</div>` : ""}
    <details class="kalhilfe datenschutz" id="datenschutz"${DS_OFFEN ? " open" : ""}><summary>Datenschutz</summary>
      Die App zählt anonym, wie oft sie geöffnet und welche Reiter angesehen werden — ohne Namen, Telefonnummern oder Standorte.
      Wer Mitteilungen einschaltet, für den wird nur die Push-Adresse des Handys und die Auswahl der Mannschaften gespeichert; Abmelden löscht beides.
      Was die App sich merkt (gewählter Reiter, letzter Stand), bleibt auf dem Handy. Keine Werbung, kein Tracking.

  const keinTicker = heute.begonnen && Date.now() >= Date.parse(sp.d) + 15 * 60e3;

    ${unten ? `<div class="zusatz">${fupaLink(esc(unten), (live || link) && fupaUrl)}</div>` : ""}${kz}${motto && !koeppi ? MOTTO : ""}

// Live in der Woche und im Knopf: alle Spiele mit möglichem Ticker im Live-Fenster (Seniors 1–3),
// je Spiel ein Worker-Stand in WS (FLF-Spiel-ID → Antwort). Unabhängig vom offenen Reiter.
const WS = new Map();
// Endstände (FuPa „POST“) überstehen das Schließen der App, bis die FLF ihr Ergebnis hat (ENDE_FRIST).
const ENDE_KEY = KEY + "_ende";
try {
  const alt = JSON.parse(localStorage.getItem(ENDE_KEY) || "{}");
  const frisch = Object.entries(alt).filter(([, w]) => Date.now() - Date.parse(w.abgerufen || 0) < ENDE_FRIST);
  for (const [id, w] of frisch) WS.set(+id, w);
  // Ältere gleich wegräumen, damit sich nichts ansammelt.
  if (frisch.length < Object.keys(alt).length) localStorage.setItem(ENDE_KEY, JSON.stringify(Object.fromEntries(frisch)));
} catch (e) {}
function endeMerken(w) {
  if (w.section !== "POST") return;
  if (!WS.has(w.fuer) || (WS.get(w.fuer).abgerufen || "") < (w.abgerufen || "")) WS.set(w.fuer, w);
  try {
    const o = {};
    for (const [id, x] of WS) if (x.section === "POST") o[id] = x;
    localStorage.setItem(ENDE_KEY, JSON.stringify(o));
  } catch (e) {}
}
// Nach dem Live-Fenster: einmal je Sitzung nachfragen; mit bekanntem Endstand gar nicht mehr.
const SPAET_VERSUCHT = new Set();
const endeBekannt = sp => WS.get(sp.id)?.section === "POST" || (L && L.flfId === sp.id && L.section === "POST");
const spaet = sp => endeBekannt(sp) || !SPAET_VERSUCHT.has(sp.id);
const imFenster = (sp, now) => now >= Date.parse(sp.d) - LIVE_FENSTER.vor && now <= Date.parse(sp.d) + LIVE_FENSTER.nach;
const brauchtAbruf = (sp, now) => imFenster(sp, now) || (!endeBekannt(sp) && !SPAET_VERSUCHT.has(sp.id));
function liveKandidaten(now) {
  if (!D || !FUPA_API) return [];
  return aufteilen(D).tabs.map(t => {
    const v = sicht(D, t.id, now), sp = liveSpiel(v, now, D.fupa || {}, spaet);
    return sp && { sp, v };
  }).filter(Boolean);
}
function liveStand(k, now) {
  return liveAnzeige(mitWorker(liveBasis(L, k.sp), wFrisch(k.sp)), k.v, now);
}
function liveZahl(now) { return liveKandidaten(now).filter(k => liveStand(k, now)?.laeuft).length; }
async function holenWorkerAlle() {
  if (!FUPA_API || !WORKER_URL) return false;
  let neu = false;
  await Promise.all(liveKandidaten(Date.now()).filter(k => brauchtAbruf(k.sp, Date.now())).map(async k => {
    SPAET_VERSUCHT.add(k.sp.id);
    const b = liveBasis(L, k.sp);
    const q = b.slug ? "?slug=" + encodeURIComponent(b.slug) : "?anstoss=" + encodeURIComponent(k.sp.d);
    try {
      const r = await fetch(WORKER_URL + q, { cache: "no-store" });
      if (!r.ok) return;
      const w = { ...(await r.json()), fuer: k.sp.id };
      if (JSON.stringify(WS.get(k.sp.id)) !== JSON.stringify(w)) { WS.set(k.sp.id, w); neu = true; }
      endeMerken(w);
    } catch (e) {}
  }));
  return neu;
}

function wocheHtml(tage, alle, now) {
  const kurz = d => { const x = new Date(d + "T12:00:00"); return x.getDate() + "." + (x.getMonth() + 1) + "."; };
  const heim = alle.filter(sp => sp.heim).length;
  // Keine Bilanz (Siege/Remis/Niederlagen): vom Verein, 22.10.2026 — es geht nicht ums Gewinnen.
  const zus = !alle.length ? "Diese Woche keine Spiele."
    : `${alle.length} ${alle.length === 1 ? "Spiel" : "Spiele"}, davon ${heim} zu Hause`;
  let h = `<section class="card"><div class="chead"><h2>Unsere Woche</h2><div class="hint tagdatum">${kurz(tage[0])} – ${kurz(tage[6])}</div></div>
    <div class="cbody"><div class="kzeile">${koeppiBild(alle.length ? "fahne" : "ruhig")}<div><div class="wzus">${esc(zus)}</div>${MOTTO}</div></div></div></section>`;
  if (!alle.length) {
    const naechstes = aufteilen(D).tabs.flatMap(t => sicht(D, t.id, now).kommend.map(sp => ({ ...sp, reiter: t.reiter })))
      .sort((a, b) => a.d.localeCompare(b.d))[0];
    if (naechstes) h += `<div class="note">Nächstes Spiel: ${esc(wann(naechstes))} · ${esc(naechstes.reiter)} gegen ${esc(anzeige(naechstes.h.id === naechstes.wir ? naechstes.a.n : naechstes.h.n))}</div>`;
    return h;
  }
  for (const tag of tage) {
    const sp = alle.filter(s => tagLux(Date.parse(s.d)) === tag);
    if (!sp.length) continue;
    const istHeute = tag === tagLux(now);
    const titel = new Date(tag + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "numeric" });
    h += `<section class="card${istHeute ? " heute" : ""}"><div class="chead"><h2>${istHeute ? "Heute · " : ""}${esc(titel)}</h2></div><div class="cbody">`;
    const kand = liveKandidaten(now);
    for (const s0 of [...sp.filter(x => !zeitOffen(x)), ...sp.filter(zeitOffen)]) {
      const k = kand.find(k => k.sp.id === s0.id), lv = k && liveStand(k, now);
      // Live-Stand vom Ticker, bis die FLF das Ergebnis hat; ohne Ticker nur „läuft“.
      // FuPa kann Heim/Gast andersherum führen (liveSpiel dreht dann k.sp) — hier gilt die FLF-Reihenfolge.
      const gedreht = k && k.sp.h.id !== s0.h.id;
      const s = lv ? { ...s0, gespielt: true, hs: gedreht ? lv.as : lv.hs, as: gedreht ? lv.hs : lv.as } : s0;
      const laeuft = !lv && !s0.gespielt && now >= Date.parse(s0.d) && now <= Date.parse(s0.d) + 3 * 3600e3 && !zeitOffen(s0);
      const ids = new Set([s.wir]);
      // Ohne FuPa-Schnittstelle weiß die App nicht, ob jemand tickt — Hinweis aufs Widget im Reiter, 15 min vor bis 3 h nach Anpfiff
      // (vom Nutzer, 29.10.2026).
      const d0 = Date.parse(s0.d), tickerHinweis = !FUPA_API && !!FUPA_WIDGET[s0.reiter] && !s0.coach && !s0.gespielt && !zeitOffen(s0)
        && now >= d0 - LIVE_FENSTER.vor && now <= d0 + LIVE_FENSTER.nach;
      const teile = [`${coachZeichen(s)}<span class="pill wteam">${esc(s.reiter)}</span>`, s.heim ? "🏠" : "✈️",
        lv ? `<span class="wlivetxt">${lv.laeuft ? "🔴 LIVE · " + esc(lv.zeit) : "Abpfiff · laut Ticker"}</span>`
          : laeuft ? `<span class="wlivetxt">${tickerHinweis ? "🔴 " : ""}läuft</span>`
          : s.gespielt ? "" : esc(zeitOffen(s) ? "Uhrzeit offen" : wann(s).split(" · ")[1]),
        // Stadion, solange die FLF kein Ergebnis hat — auch während das Spiel läuft (vom Nutzer).
        !s0.gespielt && s.ort ? "📍 " + esc(s.ort) : "",
        s.abgesagt ? "<b>abgesagt</b>" : "", s.coach ? esc(s.coach.art) : s.typ === "CUP" ? "Pokal" : s.typ === "FM" ? "Test" : "",
        s.forfait ? "Forfait" : "",
        s.zugleich.length ? `<span class="wzugleich">gleichzeitig mit ${esc(s.zugleich.join(", "))}</span>` : "",
        tickerHinweis ? `<b>Liveticker von FuPa im Reiter</b>, falls jemand tickt` : ""];
      h += `<div class="wzeile${lv?.laeuft ? " wlive" : ""}" data-gehe="${s.tab}">${spielZeile(s, ids, teile.filter(Boolean).join(" · "))}</div>`;
    }
    h += `</div></section>`;
  }
  return h;
}

async function holen() {
  for (const url of QUELLEN) {

      const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) continue;
      const d = await r.json();
      if (d && d.teams) return d;
    } catch (e) {}
  }
  return null;
}

// live.json fehlt, solange es nie ein Live-Spiel gab — dann einfach kein Kasten.

  if (!FUPA_API) return null;

    try {
      const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) return await r.json();

  return null;
}

async function aktualisieren() {
  const [d, l] = await Promise.all([holen(), holenLive()]);
  if (l) L = l;
  if (d) {
    D = d;
    try { localStorage.setItem(KEY + "_data", JSON.stringify(d)); } catch (e) {}
  } else if (!D) {
    document.getElementById("main").innerHTML = `<div class="note down">Keine Verbindung und noch kein gespeicherter Stand.</div>`;

    <button class="knopf" data-c="person_speichern">${f.id ? "Speichern" : "Anlegen und Code zeigen"}</button><button class="knopf zweit" data-c="person_abbrechen">Abbrechen</button></div>`;
}
function personenHtml(l, chefGeraete) {
  const zeile = p => {
    const offen = p.codes.filter(c => !c.eingeloest), genutzt = p.codes.filter(c => c.eingeloest);
    const kn = (c, t, x = "") => `<button class="kopie" data-c="${c}" data-id="${p.id}"${x}>${t}</button>`;
    return `<div class="cspiel"><div><b>${esc(p.name)}</b> ${p.rolle === "admin" ? `<span class="coachz">VERWALTER</span>` : p.teams.map(x => `<span class="pill wteam">${esc(x)}</span>`).join(" ")}</div>
      <div class="muted">${p.geraete ? `📱 auf ${p.geraete} ${p.geraete === 1 ? "Gerät" : "Geräten"} angemeldet` : "auf keinem Gerät angemeldet"}${genutzt.length ? ` · zuletzt eingelöst ${esc(zeitKurz(genutzt.map(c => c.eingeloest).sort().pop()))}` : ""}</div>
      ${offen.map(c => `<div class="muted">⏳ Code vom ${esc(zeitKurz(c.seit))} noch nicht eingelöst${p.darf ? ` <button class="kopie" data-c="code_weg" data-code="${c.id}">zurückziehen</button>` : ""}</div>`).join("")}
      ${p.darf ? `<div class="cknoepfe">${kn("code_neu", "+ Code für weiteres Gerät")}${p.rolle === "trainer" ? kn("person_aendern", "Mannschaften ändern") : ""}${p.geraete ? kn("geraete_weg", "Alle Geräte abmelden") : ""}${kn("person_weg", "Entfernen")}</div>` : ""}</div>`;
  };
  const chef = coachDa()?.rolle === "chef";
  const verwalter = l.filter(p => p.rolle === "admin"), trainer = l.filter(p => p.rolle === "trainer");
  return `<section class="card"><div class="chead"><h2>${chef ? "Verwalter und Trainer" : "Trainer"}</h2></div><div class="cbody">
    ${chef ? `<p class="klein">Du bist auf ${chefGeraete || 0} ${chefGeraete === 1 ? "Gerät" : "Geräten"} als Administrator angemeldet.</p>` : ""}
    ${verwalter.length ? `<div class="klein" style="font-weight:700;margin-top:6px">Verwalter</div>${verwalter.map(zeile).join("")}` : ""}
    <div class="klein" style="font-weight:700;margin-top:10px">Trainer</div>${trainer.length ? trainer.map(zeile).join("") : `<p class="klein">Noch keine Trainer angelegt.</p>`}
    ${COACH_TRAINER_FORM ? personFormHtml(COACH_TRAINER_FORM) : `<button class="knopf zweit" data-c="person_neu">+ ${chef ? "Neue Person" : "Neuer Trainer"}</button>`}</div></section>`;
}
function verlaufHtml(l) {
  if (!l?.length) return "";
  return `<details class="card"><summary><h2>Verlauf</h2><span class="hint">${l.length}</span></summary><div class="cbody">
    ${l.map(v => `<div class="cspiel"><span class="muted">${esc(zeitKurz(v.zeit))}</span> · <b>${esc(v.wer)}</b>: ${esc(v.was)}</div>`).join("")}</div></details>`;
}
async function coachHtml() {
  const box = document.getElementById("coach");
  if (!box || !COACH_OFFEN) return;
  const c = coachDa();
  if (!c) return;
  if (!COACH_LISTE) {
    box.innerHTML = `<section class="card"><div class="cbody"><p>Lade …</p></div></section>`;
    const a = await coachPost("liste").catch(() => null);
    if (a?.status === 401) { coachVergessen(); alert("Dein Coach-Zugang gilt nicht mehr. Frag nach einem neuen Code."); render(); return; }
    if (!a?.ok) { box.innerHTML = `<section class="card"><div class="cbody"><p>Keine Verbindung zum Server. Später nochmal versuchen.</p></div></section>`; return; }
    COACH_LISTE = a;
  }
  const l = COACH_LISTE.spiele || [], h = heuteLux();
  const kommend = l.filter(s => s.datum >= h), vorbei = l.filter(s => s.datum < h).reverse();
  let x = `<section class="card"><div class="chead"><h2>${c.rolle === "chef" ? "ADMINISTRATOR" : c.rolle === "admin" ? "Verwalter" : "Coach"} – ${esc(c.name)}</h2></div><div class="cbody">`;
  if (COACH_CODE) x += `<div class="note up"><b>Code für ${esc(COACH_CODE.name)}: <span class="ccode">${esc(COACH_CODE.code)}</span></b><br>
    Gilt einmal, für ein Gerät, und wird nicht noch einmal angezeigt. So geht's: am iPhone die App vom Home-Bildschirm öffnen (am Computer
    einfach fckoeppchen.github.io) → 5× aufs Logo oben → Code eingeben.
    <br><button class="kopie" data-c="codekopie">Code kopieren</button> <button class="kopie" data-c="codeweg">Erledigt</button></div>`;
  x += COACH_FORM ? coachFormHtml(COACH_FORM) : `<button class="knopf" data-c="neu">+ Neues Spiel eintragen</button>`;
  x += `<p class="klein" style="margin-top:10px">Eingetragene Spiele sehen alle nach ca. 10 Minuten in der App, in „Unsere Woche“ und im Kalender-Abo.
    Abgesagte Spiele bleiben mit „abgesagt“ stehen, damit die Eltern es merken. Löschen nur bei Tippfehlern.</p>
    <div class="stand" id="cStand">${esc(COACH_STAND)}</div></div></section>`;
  x += `<section class="card"><div class="chead"><h2>${coachAdmin() ? "Alle eingetragenen Spiele" : "Meine Spiele"}</h2></div><div class="cbody">
    ${kommend.length ? kommend.map(coachZeile).join("") : `<p class="klein">Keine kommenden Spiele eingetragen.</p>`}
    ${vorbei.length ? `<details><summary class="klein">Vorbei (${vorbei.length})</summary>${vorbei.map(coachZeile).join("")}</details>` : ""}</div></section>`;
  if (coachAdmin()) x += personenHtml(COACH_LISTE.personen || [], COACH_LISTE.chefGeraete) + verlaufHtml(COACH_LISTE.verlauf);
  x += `<button class="knopf zweit" data-c="abmelden" style="margin-bottom:12px">Coach auf diesem Gerät abmelden</button>`;
  box.innerHTML = x;
}
const cWert = id => document.getElementById(id)?.value || "";
function coachFormLesen() {
  const offen = document.getElementById("cfOffen").checked;
  return { id: COACH_FORM?.id || undefined, reiter: cWert("cfReiter"), art: cWert("cfArt"), datum: cWert("cfDatum"),
    zeit: offen ? null : zeitLesen("cfZeit"), ende: zeitLesen("cfEnde"), gegner: cWert("cfGegner").trim(),
    heim: cWert("cfHeim") === "1", ort: cWert("cfOrt").trim() || null, bem: cWert("cfBem").trim() || null, abgesagt: !!COACH_FORM?.abgesagt };
}
async function coachSpeichern(s, stand) {
  const a = await coachPost("speichern", { spiel: s }).catch(() => ({ fehler: "Keine Verbindung" }));
  if (a.status === 401) { coachVergessen(); alert("Dein Coach-Zugang gilt nicht mehr."); render(); return false; }
  if (!a.ok) { stand(a.fehler || "Speichern ging nicht (" + (a.status || "?") + ")"); return false; }
  return true;
}
document.addEventListener("change", e => {
  if (e.target.id === "cfOffen") for (const z of ["cfZeitH", "cfZeitM"]) { const el = document.getElementById(z); el.disabled = e.target.checked; if (e.target.checked && z === "cfZeitH") el.value = ""; }
  if (e.target.id === "ctRolle") document.getElementById("ctTeams").hidden = e.target.value === "admin";
  if (e.target.id === "cfDatum") document.getElementById("cfDatumText").textContent = datumLang(e.target.value);
  // Zu Hause → Heimplatz eintragen, auswärts → Feld leeren, wenn noch der Heimplatz drinsteht.
  if (e.target.id === "cfHeim") { const o = document.getElementById("cfOrt"); if (e.target.value === "1" && !o.value.trim()) o.value = HEIMPLATZ; else if (e.target.value === "0" && o.value === HEIMPLATZ) o.value = ""; }
});
document.addEventListener("click", async e => {
  if (e.target.closest("#coachknopf")) { COACH_OFFEN = !COACH_OFFEN; MITT_OFFEN = false; COACH_STAND = ""; COACH_LISTE = null; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("#coach [data-c]");
  if (!b) return;
  const c = b.dataset.c, id = +b.dataset.id, s = (COACH_LISTE?.spiele || []).find(x => x.id === id), p = (COACH_LISTE?.personen || []).find(x => x.id === id);
  const neu = () => { COACH_LISTE = null; coachHtml(); };
  if (c === "neu") { COACH_FORM = { heim: true }; COACH_STAND = ""; coachHtml(); }
  else if (c === "abbrechen") { COACH_FORM = null; coachHtml(); }
  else if (c === "aendern" && s) { COACH_FORM = { ...s }; coachHtml(); window.scrollTo(0, 0); }
  else if (c === "kopie" && s) { COACH_FORM = { ...s, id: undefined, datum: "", abgesagt: false }; coachHtml(); window.scrollTo(0, 0); }
  else if (c === "speichern") {
    const f = coachFormLesen(), st = t => { document.getElementById("cFormStand").textContent = t; };
    if (!f.datum) return st("Bitte ein Datum wählen.");
    if (!f.zeit && !document.getElementById("cfOffen").checked) return st("Bitte eine Uhrzeit eingeben oder „Uhrzeit noch offen“ anhaken.");
    if (!f.gegner) return st(mitGegner(f.art) ? "Bitte den Gegner eintragen." : "Bitte den Veranstalter eintragen.");
    // Doppelt? Nachfragen statt verbieten (an einem Turniertag kann es wirklich zwei Einträge geben). Vorher die Liste frisch
    // holen — hat inzwischen jemand anderes dasselbe Spiel eingetragen, soll es die Nachfrage kennen.
    b.disabled = true; st("Prüfe …");
    const frisch = await coachPost("liste").catch(() => null);
    if (frisch?.ok && COACH_LISTE) COACH_LISTE.spiele = frisch.spiele;
    b.disabled = false; st("");
    const gleich = (!COACH_FORM?.id || COACH_FORM.datum !== f.datum || COACH_FORM.reiter !== f.reiter) ? gleicherTag(f) : [];
    if (gleich.length && !confirm(`Am ${datumLang(f.datum).slice(2)} steht schon:\n\n${gleich.join("\n")}\n\nTrotzdem speichern?`)) return st("Nicht gespeichert.");
    b.disabled = true; st("Speichere …");
    if (await coachSpeichern(f, st)) { COACH_FORM = null; COACH_STAND = "Gespeichert ✓ In ca. 10 Minuten sehen es alle."; neu(); }
    else b.disabled = false;
  }
  else if (c === "absagen" && s) {
    if (!s.abgesagt && !confirm(`${coachName(s.reiter)} am ${datumText(s)} wirklich absagen? Es bleibt mit „abgesagt“ stehen.`)) return;
    if (await coachSpeichern({ ...s, abgesagt: !s.abgesagt }, t => { COACH_STAND = t; })) COACH_STAND = s.abgesagt ? "Wieder angesetzt ✓" : "Abgesagt ✓ In ca. 10 Minuten sehen es alle.";
    neu();
  }
  else if (c === "loeschen" && s) {
    if (!confirm("Wirklich löschen? Nur bei Tippfehlern – sonst lieber „Absagen“, damit die Eltern es merken.")) return;
    const a = await coachPost("loeschen", { id }).catch(() => ({}));
    COACH_STAND = a.ok ? "Gelöscht." : "Löschen ging nicht."; neu();
  }
  else if (c === "person_neu") { COACH_TRAINER_FORM = { rolle: "trainer" }; coachHtml(); }
  else if (c === "person_abbrechen") { COACH_TRAINER_FORM = null; coachHtml(); }
  else if (c === "person_aendern" && p) { COACH_TRAINER_FORM = { id: p.id, name: p.name, rolle: p.rolle, teams: p.teams }; coachHtml(); document.getElementById("cPerson")?.scrollIntoView(); }
  else if (c === "person_speichern") {
    const f = COACH_TRAINER_FORM || {}, name = cWert("ctName").trim(), rolle = f.id ? f.rolle : (cWert("ctRolle") || "trainer");
    const teams = [...document.querySelectorAll(".ctTeam:checked")].map(x => x.value);
    if (!name || (rolle === "trainer" && !teams.length)) return alert(rolle === "trainer" ? "Bitte Name und mindestens eine Mannschaft." : "Bitte einen Namen.");
    const a = await coachPost(f.id ? "person_aendern" : "person_neu", { id: f.id, name, rolle, teams }).catch(() => ({}));
    if (!a.ok) return alert(a.fehler || "Speichern ging nicht.");
    COACH_TRAINER_FORM = null;
    if (a.code) COACH_CODE = { name: a.name, code: a.code };
    else COACH_STAND = name + " geändert ✓";
    neu(); window.scrollTo(0, 0);
  }
  else if (c === "code_neu" && p) {
    if (!confirm(`Weiteren Code für ${p.name} machen (z. B. für den Computer)? Die angemeldeten Geräte bleiben angemeldet.`)) return;
    const a = await coachPost("code_neu", { id: p.id }).catch(() => ({}));
    if (!a.ok) return alert(a.fehler || "Ging nicht.");
    COACH_CODE = { name: a.name, code: a.code }; neu(); window.scrollTo(0, 0);
  }
  else if (c === "code_weg") {
    if (!confirm("Diesen Code zurückziehen? Er gilt dann nicht mehr.")) return;
    const a = await coachPost("code_weg", { code: +b.dataset.code }).catch(() => ({}));
    COACH_STAND = a.ok ? "Code zurückgezogen." : (a.fehler || "Ging nicht."); neu();
  }
  else if (c === "geraete_weg" && p) {
    if (!confirm(`Alle Geräte von ${p.name} abmelden (z. B. Handy verloren)? Zum Wiederkommen braucht ${p.name} einen neuen Code.`)) return;
    const a = await coachPost("geraete_weg", { id: p.id }).catch(() => ({}));
    COACH_STAND = a.ok ? `Alle Geräte von ${p.name} abgemeldet.` : (a.fehler || "Ging nicht."); neu();
  }
  else if (c === "person_weg" && p) {
    if (!confirm(`${p.name} entfernen? Alle Geräte werden abgemeldet. Die eingetragenen Spiele bleiben stehen.`)) return;
    const a = await coachPost("person_weg", { id: p.id }).catch(() => ({}));
    COACH_STAND = a.ok ? `${p.name} entfernt.` : (a.fehler || "Ging nicht."); neu();
  }
  else if (c === "codekopie" && COACH_CODE) { try { await navigator.clipboard.writeText(COACH_CODE.code); b.textContent = "Kopiert ✓"; } catch (e) { prompt("Code:", COACH_CODE.code); } }
  else if (c === "codeweg") { COACH_CODE = null; coachHtml(); }
  else if (c === "abmelden") {
    if (!confirm(coachDa()?.rolle === "chef" ? "Coach auf diesem Gerät abmelden? Zum Wiederkommen 5× aufs Logo und deinen Code." : "Coach auf diesem Gerät abmelden? Zum Wiederkommen brauchst du einen neuen Code.")) return;
    await coachPost("abmelden").catch(() => {});
    coachVergessen(); render();
  }
});
coachKnopfZeigen();
coachPruefen();

// Reiter-Leiste beim Runterscrollen weg, beim Hochscrollen wieder da (vom Nutzer, 26.10.2026). Weg nach 30 px
// runter (schon ab 60 px von oben), zurück erst nach 150 px hoch (am iPhone kam sie sonst bei jedem kleinen
// Zurückscrollen); oben immer sichtbar. Die letzten 80 px vor dem Ende zählen nicht; Nachfedern ist oben und unten
// aus (overscroll-behavior: unten flackerte der Kopf, nur unten abfangen ließ ihn unter die Reiter federn). Tippen auf den Kopf holt sie auch zurück.
const LEISTE = document.getElementById("leiste");
let L_Y = 0, L_SUMME = 0;
function kopfHoehe() { document.documentElement.style.setProperty("--kopfH", document.querySelector("header").offsetHeight + "px"); }
function leisteZeigen() { LEISTE.classList.remove("weg"); L_SUMME = 0; }
addEventListener("scroll", () => {
  const y = scrollY, max = document.documentElement.scrollHeight - innerHeight, d = y - L_Y;
  L_Y = y;
  if (y < 60) return leisteZeigen();
  if (y > max - 80) { L_SUMME = 0; return; }
  L_SUMME = (Math.sign(d) === Math.sign(L_SUMME) ? L_SUMME : 0) + d;
  if (L_SUMME > 30) LEISTE.classList.add("weg");
  else if (L_SUMME < -150) leisteZeigen();
}, { passive: true });
addEventListener("resize", kopfHoehe);
document.querySelector("header").addEventListener("click", e => { if (!e.target.closest("#zahnrad, #coachknopf")) leisteZeigen(); });
kopfHoehe();

document.getElementById("logo").src = LOGO;
load();
// Umzug (vom Nutzer): die Umzugsseite der alten App schickt ?reiter=<zuletzt gewählter Reiter> mit. Einmal übernehmen und
// aus der Adresse nehmen — sonst landete der Parameter in der Home-Bildschirm-App und setzte bei jedem Start den Reiter.
try {
  const r = new URLSearchParams(location.search).get("reiter");
  if (r) { ST.team = /^\d+$/.test(r) ? +r : r; persist(); history.replaceState(null, "", location.pathname + location.hash); }
} catch (e) {}
try { D = JSON.parse(localStorage.getItem(KEY + "_data") || "null"); } catch (e) {}
render();
aktualisieren().finally(zaehle);   // nach dem Laden, damit der Reiter bekannt ist
</script>
